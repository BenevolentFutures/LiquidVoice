name: Build and Test

# Unsigned Debug build and the full test suite on a GitHub-hosted Mac.
# No secrets and no signing identity are needed.
#
# SwiftLint --strict is not run here yet: the tree has existing strict
# violations. Add a lint job back once they are fixed.

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Fluid.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.github/workflows/build.yml'

  build:
    name: Build and test MouthKeys
    # A manual run always builds; otherwise only when build inputs changed, and never for a draft PR.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.relevant == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)))
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xcpretty
      run: sudo gem install xcpretty

    # The code uses Swift 6.2 (@concurrent), so it needs Xcode 26 or later.
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '^26.0.0'

    - name: Show Xcode version
      run: xcodebuild -version

    # Tiny Whisper GGUF output is nondeterministic on hosted macOS runners.
    # Keep this E2E assertion in the suite for local validation, but skip it in CI.
    - name: Build and test (excluding flaky Tiny Whisper E2E)
      run: |
        set -o pipefail
        xcodebuild test \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -destination 'platform=macOS,arch=arm64' \
          -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty
