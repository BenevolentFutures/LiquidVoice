# mouthkeys.com: the one-page site in site/, deployed to GitHub Pages.
# site/assemble.sh adds the README screenshots and the app icon at deploy time.
name: Pages

on:
  push:
    branches: [liquid-voice]
    paths:
      - "site/**"
      - "docs/images/**"
      - "Sources/Fluid/Assets.xcassets/AppIcon.appiconset/icon-128@2x.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: site/assemble.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
