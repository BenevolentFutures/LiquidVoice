<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Voice · Lumen</title>
<link rel="stylesheet" href="../shared/stage.css">
<style>
/* =====================================================================================
   LUMEN — the overlay is a lens.
   Everything here is the operating system's own material: Liquid Glass on macOS 26,
   NSVisualEffectView + vibrancy on macOS 15. The voice inside is liquid light.

   Native mapping legend (repeated per rule below):
   [26]  macOS 26  SwiftUI  .glassEffect(.regular, in: RoundedRectangle(cornerRadius:, style: .continuous))
   [15]  macOS 15  NSVisualEffectView(material: .hudWindow dark / .popover light, blendingMode: .behindWindow, state: .active)
   [CA]  CoreAnimation layer (CAGradientLayer / CAShapeLayer / shadow)
   ===================================================================================== */

:root {
  --lv-font: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;

  /* ---- motion tokens (DIRECTION.md § Motion) ---- */
  --ease-out: cubic-bezier(0.2, 0.7, 0.3, 1);    /* SwiftUI .timingCurve(0.2, 0.7, 0.3, 1) */
  --ease-in:  cubic-bezier(0.4, 0, 1, 1);         /* exits */
  --ease-io:  cubic-bezier(0.45, 0, 0.25, 1);     /* cross-fades */
  --t-enter: 110ms;   /* overlay fade in */
  --t-edge: 120ms;    /* refractive edge lights up */
  --t-exit: 150ms;    /* dismiss: fade + 0.985 scale + 6 px drop */
  --t-hover: 120ms;
  --t-press: 90ms;    /* bead compresses */
  --t-release: 140ms;
  --t-face: 120ms;    /* content swaps inside the lens */
  --t-grow: 140ms;    /* failed card grows upward */

  /* ---- geometry ---- */
  --pill-w: 340px;
  --pill-h: 150px;        /* reserved for meta + 3 preview lines + trace; constant across listening/transcribing/delivered */
  --pill-h-tall: 195px;   /* failed: grows upward by 45 px; rails and trace do not move */
  --pill-r: 20px;
  --bead: 30px;
  --bead-r: 11px;
  --gap: 6px;
  --pad-x: 22px;
  --pad-y: 12px;
  --rail-h: var(--pill-h);
}

/* ---- dark tokens (default) ---- */
:root, :root[data-appearance="dark"] {
  --g-fill: rgba(255,255,255,0.09);
  --g-fill-hover: rgba(255,255,255,0.18);
  --g-fill-press: rgba(255,255,255,0.26);
  --g-sheet: rgba(255,255,255,0.09);
  --g-menu: rgba(34,36,46,0.46);
  --g-spec: rgba(255,255,255,0.10);           /* broad specular across the top third */
  --g-e0: rgba(255,255,255,0.55);             /* refractive edge, top-left */
  --g-e1: rgba(255,255,255,0.20);
  --g-e2: rgba(255,255,255,0.03);             /* along the other diagonal */
  --g-e3: rgba(255,255,255,0.13);
  --g-e4: rgba(255,255,255,0.35);             /* bottom-right */
  --g-inner: rgba(0,0,0,0.25);                /* 1 px inner shadow at the bottom: thickness */
  --g-rim: 0 0 0 0 transparent;               /* dark needs no outer hairline */
  --g-shadow: 0 12px 32px rgba(0,0,0,0.35);
  --g-dot: rgba(255,255,255,0.45);            /* bead specular dot */
  --g-rim-a: rgba(255,255,255,0.10);          /* inner rim, top-left */
  --g-rim-b: rgba(255,255,255,0.06);          /* inner rim, bottom-right */
  --tx: rgba(255,255,255,0.95);
  --tx-2: rgba(255,255,255,0.80);
  --tx-meta: rgba(255,255,255,0.60);
  --glyph: rgba(255,255,255,0.85);
  --hairline: rgba(255,255,255,0.10);
  --band: rgba(255,255,255,0.08);             /* history row hover: brighter glass band */
  --band-edge: rgba(255,255,255,0.16);
  --accent: #7FD4FF;
  --ok-ink: #8FE8B8;
  --ok-glow: rgba(143,232,184,0.75);
  --warn-ink: #FFC46B;
  --warn-fill: rgba(255,196,107,0.14);
  --warn-fill-hover: rgba(255,196,107,0.22);
  --warn-fill-press: rgba(255,196,107,0.30);
  --menu-hi: rgba(127,212,255,0.26);
  --menu-hi-tx: #FFFFFF;
}

/* ---- light tokens: light glass on a light desktop, dark ink, the same refraction ---- */
:root[data-appearance="light"] {
  --g-fill: rgba(255,255,255,0.68);
  --g-fill-hover: rgba(255,255,255,0.90);
  --g-fill-press: rgba(255,255,255,1.00);
  --g-sheet: rgba(255,255,255,0.78);
  --g-menu: rgba(246,247,251,0.78);
  --g-spec: rgba(255,255,255,0.40);
  --g-e0: rgba(255,255,255,1.00);
  --g-e1: rgba(255,255,255,0.55);
  --g-e2: rgba(20,30,60,0.07);                /* on light glass the "dark" diagonal is a faint ink, not nothing */
  --g-e3: rgba(255,255,255,0.45);
  --g-e4: rgba(255,255,255,0.90);
  --g-inner: rgba(0,0,0,0.10);
  --g-rim: 0 0 0 0.5px rgba(10,20,50,0.14);   /* 0.5 px outer hairline so light glass holds its shape */
  --g-shadow: 0 12px 32px rgba(10,20,50,0.18);
  --g-dot: rgba(255,255,255,0.95);
  --g-rim-a: rgba(255,255,255,0.55);
  --g-rim-b: rgba(255,255,255,0.35);
  --tx: rgba(11,12,16,0.90);
  --tx-2: rgba(11,12,16,0.76);
  --tx-meta: rgba(0,0,0,0.55);
  --glyph: rgba(0,0,0,0.75);
  --hairline: rgba(0,0,0,0.08);
  --band: rgba(255,255,255,0.55);
  --band-edge: rgba(10,20,50,0.08);
  --accent: #1C8EEA;
  --ok-ink: #15935B;
  --ok-glow: rgba(143,232,184,0.95);
  --warn-ink: #9A5A00;
  --warn-fill: rgba(255,196,107,0.30);
  --warn-fill-hover: rgba(255,196,107,0.42);
  --warn-fill-press: rgba(255,196,107,0.55);
  --menu-hi: rgba(58,166,255,0.22);
  --menu-hi-tx: rgba(0,0,0,0.9);
}

/* =====================================================================================
   Material
   ===================================================================================== */

/* Glass. [26] glassEffect(.regular). [15] NSVisualEffectView .hudWindow/.popover, .behindWindow.
   The top-third specular is a CAGradientLayer (white 0.10 -> 0, top to 34%) above the effect view.
   Shadow: [26] system glass shadow; [15] window-level shadow off, a CALayer shadow (0, -12, r 16, 0.35). */
.lv-glass {
  position: relative;
  background-color: var(--g-fill);
  background-image: linear-gradient(180deg, var(--g-spec) 0%, rgba(255,255,255,0) 34%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  box-shadow: var(--g-shadow), var(--g-rim), inset 0 -1px 0 var(--g-inner);
}

/* Refractive edge: a 1 px stroke of specular light, brightest top-left and bottom-right,
   near zero along the other diagonal. [CA] CAGradientLayer(.axial, start (0,0), end (1,1)) masked by a
   CAShapeLayer stroking the same RoundedRectangle(.continuous) with lineWidth 1. In unit space an axial
   gradient from (0,0) to (1,1) has isolines parallel to the TR–BL diagonal, identical to CSS "to bottom right".
   [26] draws its own lensing rim; we add this stroke on top at 0.8 so both OS versions share the highlight. */
.lv-edge::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(to bottom right,
    var(--g-e0) 0%, var(--g-e1) 18%, var(--g-e2) 40%, var(--g-e2) 60%, var(--g-e3) 82%, var(--g-e4) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  z-index: 2;
}

/* =====================================================================================
   Overlay layout: [ rail ] 6 [ pill ] 6 [ rail ], bottom-aligned so the pill can grow upward
   ===================================================================================== */
.overlay-host > .lv-root { margin-bottom: 50px; position: relative; font-family: var(--lv-font); }
.overlay-host > .lv-root.is-hidden { pointer-events: none; }
.lv-root[data-shape="tall"] { --rail-anchor: var(--pill-h-tall); }

.lv-stack {
  display: flex; align-items: flex-end; gap: var(--gap);
  transform-origin: 50% 100%;
  /* dismiss: 150 ms, 0.985 scale, 6 px drop. SwiftUI .scaleEffect(0.985).offset(y: 6) + opacity, .timingCurve(0.4,0,1,1, 0.15) */
  transition: transform var(--t-exit) var(--ease-in);
}
.lv-root.is-hidden .lv-stack { transform: translateY(6px) scale(0.985); }
.lv-root:not(.is-hidden) .lv-stack { transition: none; }

/* Opacity lives on each glass surface, never on an ancestor: an ancestor with opacity < 1 would become a
   backdrop root and the glass would lose its blur mid-fade. Native: animate the panel's alphaValue. */
.lv-pill { opacity: 1; transition: opacity var(--t-enter) var(--ease-out), height var(--t-grow) var(--ease-out); }
.lv-root.is-hidden .lv-pill { opacity: 0; transition: opacity var(--t-exit) var(--ease-in), height var(--t-grow) var(--ease-out); }
.lv-root.is-hidden .lv-rail > .bead { opacity: 0; transition: opacity var(--t-exit) var(--ease-in); }
/* the edge lights up slightly after the body arrives */
.lv-stack .lv-edge::before { transition: opacity var(--t-edge) var(--ease-out) 20ms; }
.lv-root.is-hidden .lv-stack .lv-edge::before { opacity: 0; transition: opacity var(--t-exit) var(--ease-in); }

/* ---------- rails ---------- */
.lv-rail {
  width: var(--bead); height: var(--rail-h); flex: none;
  display: flex; flex-direction: column; justify-content: space-between; /* hidden middle slot = the space between */
}

/* ---------- glass beads (chips) ----------
   [26] Button { Image(systemName:) }.buttonStyle(.glass) inside a GlassEffectContainer; clipShape
   RoundedRectangle(cornerRadius: 11, style: .continuous). [15] 30x30 NSVisualEffectView + the edge layer.
   Specular dot: radial CAGradientLayer white 0.45 -> 0, radius 12 pt (40% of the bead), centred (9, 8).
   Pressed: ButtonStyle reads configuration.isPressed -> scaleEffect(0.94), .easeOut(duration: 0.09). */
.bead {
  width: var(--bead); height: var(--bead); border-radius: var(--bead-r);
  border: 0; padding: 0; margin: 0; display: grid; place-items: center;
  color: var(--glyph); cursor: default; font: inherit; outline: none;
  -webkit-tap-highlight-color: transparent;
  transition: opacity var(--t-enter) var(--ease-out), background-color var(--t-hover) var(--ease-out), transform var(--t-release) var(--ease-out);
}
.bead::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(12px circle at 9px 8px, var(--g-dot), rgba(255,255,255,0));
}
.bead:hover { background-color: var(--g-fill-hover); }
.bead:active { transform: scale(0.94); background-color: var(--g-fill-press);
  transition: opacity var(--t-enter) var(--ease-out), background-color var(--t-press) var(--ease-out), transform var(--t-press) var(--ease-out); }
.bead[aria-disabled="true"] { pointer-events: none; }
.bead[aria-disabled="true"] .gl-main { opacity: 0.32; }
.bead:focus-visible { box-shadow: var(--g-shadow), 0 0 0 2px var(--accent); }
.bead .gl { width: 16px; height: 16px; position: relative; z-index: 1; transition: opacity var(--t-face) var(--ease-io); }
.bead .gl-alt { position: absolute; left: 7px; top: 7px; opacity: 0; color: var(--ok-ink);
  filter: drop-shadow(0 0 4px var(--ok-glow)); }  /* [CA] symbol layer shadow: color ok, radius 4, opacity 1 */
.bead .bloom { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 50%, rgba(143,232,184,0.38), rgba(143,232,184,0) 70%); }
.bead.is-done .gl-main { opacity: 0; }
.bead.is-done .gl-alt { opacity: 1; }
.bead.is-done .bloom { animation: lv-bloom 900ms var(--ease-out) forwards; }
@keyframes lv-bloom { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- the lens (pill) ---------- */
.lv-pill {
  width: var(--pill-w); height: var(--pill-h); border-radius: var(--pill-r); flex: none;
  box-sizing: border-box; padding: var(--pad-y) var(--pad-x);
  display: flex; flex-direction: column; gap: 8px; overflow: hidden;
}
.lv-root[data-shape="tall"] .lv-pill { height: var(--pill-h-tall); }
/* Inner rim: a 6 px band just inside the edge, lit on the same diagonal, softened. It reads as the thickness of the
   lens. [CA] CAGradientLayer (0,0)->(1,1) masked by a 6 pt stroke of the inset path, layer.filters = [CIGaussianBlur r 2].
   [26] omitted: Liquid Glass renders its own lensing band. */
.lv-pill::after { content: ""; position: absolute; inset: 1px; border-radius: calc(var(--pill-r) - 1px); padding: 6px; pointer-events: none;
  background: linear-gradient(to bottom right, var(--g-rim-a) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 74%, var(--g-rim-b) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  filter: blur(2px); z-index: 1; }
.lv-upper { position: relative; flex: 1 1 auto; min-height: 0; }
.lv-trace-row { flex: none; height: 44px; display: flex; align-items: center; gap: 16px; }
.lv-appicon { width: 20px; height: 20px; flex: none; display: block; }
.lv-trace { position: relative; width: 260px; height: 44px; flex: none; }
.lv-trace canvas { position: absolute; left: -14px; top: -14px; width: 288px; height: 72px; pointer-events: none; }

/* faces: content that swaps inside the lens, always in reserved space */
.face { position: absolute; left: 0; right: 0; top: 0; bottom: 0; opacity: 0; visibility: hidden;
  transition: opacity var(--t-face) var(--ease-io), visibility 0s linear var(--t-face); }
.face.on { opacity: 1; visibility: visible; transition: opacity var(--t-face) var(--ease-io), visibility 0s; }

.meta-row { position: absolute; left: 0; right: 0; top: 0; height: 14px; display: flex; align-items: center;
  justify-content: space-between; font: 500 11.5px/14px var(--lv-font); color: var(--tx-meta);
  font-variant-numeric: tabular-nums; letter-spacing: 0.005em; transition: opacity var(--t-face) var(--ease-io); }
.meta-row .mic { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.meta-row .mic svg { width: 11px; height: 11px; }
.meta-row .timer { min-width: 34px; text-align: right; }
.preview { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; overflow: hidden; display: flex; align-items: flex-end; }
.preview p { margin: 0; width: 100%; font: 500 13.5px/18px var(--lv-font); color: var(--tx); letter-spacing: -0.003em;
  transition: opacity var(--t-face) var(--ease-io); }
.face-live.is-settled .preview p, .face-live.is-settled .meta-row { opacity: 0.55; }

.face-delivered { display: flex; align-items: center; }
.d-line { display: flex; align-items: center; gap: 8px; height: 18px; font: 500 13.5px/18px var(--lv-font);
  white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-line .d-main { color: var(--tx); font-weight: 600; }
.d-line .d-meta { color: var(--tx-meta); }
.d-check { width: 16px; height: 16px; color: var(--accent); flex: none; }
.face-delivered.on .d-check { animation: lv-flush 240ms var(--ease-out) forwards; }
@keyframes lv-flush {
  from { color: var(--accent); filter: drop-shadow(0 0 0 rgba(143,232,184,0)); }
  to   { color: var(--ok-ink); filter: drop-shadow(0 0 5px var(--ok-glow)); }
}

.face-failed { top: auto; height: calc(var(--pill-h-tall) - var(--pad-y) * 2 - 8px - 44px); display: flex; flex-direction: column; }
.f-head { display: flex; align-items: center; gap: 8px; height: 18px; font: 600 13.5px/18px var(--lv-font); color: var(--tx); white-space: nowrap; }
.f-head svg { width: 16px; height: 16px; color: var(--warn-ink); flex: none; }
.f-text { margin: 6px 0 0; font: 400 13px/17.5px var(--lv-font); color: var(--tx-2); height: 52.5px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.f-actions { margin-top: auto; display: flex; align-items: center; gap: 4px; height: 28px; }
.f-meta { margin-left: auto; font: 500 11.5px/14px var(--lv-font); color: var(--tx-meta); font-variant-numeric: tabular-nums; }

/* Copy: an amber-tinted glass button, fixed 88 x 28, label swaps in place.
   [26] Button("Copy").buttonStyle(.glass).tint(Color(#FFC46B)); [15] NSButton .rounded-rect in the effect view,
   layer background amber 0.14 + the edge layer. */
.btn-copy { position: relative; width: 88px; height: 28px; border-radius: 10px; border: 0; padding: 0; margin: 0;
  background-color: var(--warn-fill); color: var(--warn-ink); font: 600 13px/28px var(--lv-font); cursor: default; outline: none;
  transition: background-color var(--t-hover) var(--ease-out), transform var(--t-release) var(--ease-out); }
.btn-copy:hover { background-color: var(--warn-fill-hover); }
.btn-copy:active { transform: scale(0.96); background-color: var(--warn-fill-press); transition-duration: var(--t-press); }
.btn-copy .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity var(--t-face) var(--ease-io); }
.btn-copy .lbl svg { width: 14px; height: 14px; }
.btn-copy .l-done { opacity: 0; color: var(--ok-ink); }
.btn-copy .l-done svg { filter: drop-shadow(0 0 4px var(--ok-glow)); }
.btn-copy.is-done .l-copy { opacity: 0; }
.btn-copy.is-done .l-done { opacity: 1; }
.btn-text { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--tx-meta);
  font: 500 13px/28px var(--lv-font); cursor: default; outline: none; transition: color var(--t-hover) var(--ease-out), background-color var(--t-hover) var(--ease-out); }
.btn-text:hover { color: var(--tx); background-color: var(--band); }

/* =====================================================================================
   History card: a glass sheet, blur 40, anchored to the History bead's leading edge, 6 px above it
   [26] child NSPanel hosting .glassEffect(.regular, in: RoundedRectangle(cornerRadius: 16)).
   [15] NSVisualEffectView .popover (.hudWindow dark) blur is the system's; the extra blur radius maps to
   the material, not to a number.
   ===================================================================================== */
.lv-history {
  position: absolute; left: 0; bottom: calc(var(--rail-anchor, var(--pill-h)) + var(--gap)); width: 480px; max-height: 480px;
  border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; pointer-events: none;
  background-color: var(--g-sheet);
  background-image: linear-gradient(180deg, var(--g-spec) 0%, rgba(255,255,255,0) 22%);
  -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
  box-shadow: var(--g-shadow), var(--g-rim), inset 0 -1px 0 var(--g-inner);
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 120ms var(--ease-in), transform 120ms var(--ease-in), visibility 0s linear 120ms;
}
.lv-history.open { opacity: 1; visibility: visible; transform: none; pointer-events: auto;
  transition: opacity var(--t-enter) var(--ease-out), transform var(--t-enter) var(--ease-out), visibility 0s; }
.lv-history.open.lv-edge::before { transition: opacity var(--t-edge) var(--ease-out) 20ms; }
.lv-history:not(.open).lv-edge::before { opacity: 0; }
.h-head { flex: none; height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  box-shadow: inset 0 -1px 0 var(--hairline); }
.lbl-caps { font: 600 10.5px/14px var(--lv-font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--tx-meta); }
.h-hint { font: 500 11.5px/14px var(--lv-font); color: var(--tx-meta); font-variant-numeric: tabular-nums; }
.h-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 6px 8px; overscroll-behavior: contain;
  /* soft bottom scroll edge. [26] .scrollEdgeEffectStyle(.soft, for: .bottom); [15] a CAGradientLayer mask on the clip view */
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
.h-list::-webkit-scrollbar { width: 10px; }
.h-list::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.h-sec { padding: 10px 10px 4px; }
.h-row { position: relative; display: block; width: 100%; text-align: left; border: 0; margin: 0; background: transparent;
  padding: 9px 10px 10px; border-radius: 10px; color: inherit; font: inherit; cursor: default; outline: none;
  transition: background-color var(--t-hover) var(--ease-out), box-shadow var(--t-hover) var(--ease-out); }
.h-row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: var(--hairline);
  transition: opacity var(--t-hover) var(--ease-out); }
.h-sec + .h-row::before { opacity: 0; }
.h-row:hover { background-color: var(--band); box-shadow: inset 0 1px 0 var(--band-edge), inset 0 0 0 0.5px var(--band-edge); }
.h-row:hover::before, .h-row:hover + .h-row::before { opacity: 0; }
.h-row:active { background-color: var(--g-fill-hover); }
.h-row.is-picked { background-color: var(--g-fill-press); }
.h-text { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  font: 400 13px/18px var(--lv-font); color: var(--tx); }
.h-meta { display: block; margin-top: 5px; font: 500 11.5px/14px var(--lv-font); color: var(--tx-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.h-meta .nd { color: var(--warn-ink); }

/* =====================================================================================
   Menu bar item + menu (NSStatusItem template image; NSMenu)
   ===================================================================================== */
.lv-status { color: inherit; }
.lv-status svg { width: 16px; height: 16px; display: block; transition: opacity 180ms var(--ease-io); }
.lv-status.is-dim svg { opacity: 0.45; }

.lv-menu {
  position: fixed; top: 29px; z-index: 300; width: 292px; padding: 5px; border-radius: 12px; box-sizing: border-box;
  font: 400 13px/1 var(--lv-font); color: var(--tx);
  background-color: var(--g-menu); background-image: linear-gradient(180deg, var(--g-spec) 0%, rgba(255,255,255,0) 30%);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--g-shadow), var(--g-rim), inset 0 -1px 0 var(--g-inner);
  opacity: 0; visibility: hidden; transition: opacity 90ms var(--ease-in), visibility 0s linear 90ms;
}
.lv-menu.open { opacity: 1; visibility: visible; transition: opacity 60ms var(--ease-out), visibility 0s; }
.lv-menu .mi { position: relative; height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 7px; white-space: nowrap; cursor: default; }
.lv-menu .mi:hover, .lv-menu .mi.hot { background: var(--menu-hi); color: var(--menu-hi-tx); }
.lv-menu .mi .sp { flex: 1; }
.lv-menu .mi kbd { font: 400 13px/1 var(--lv-font); color: var(--tx-meta); }
.lv-menu .mi .val { color: var(--tx-meta); overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.lv-menu .mi .chev { width: 10px; height: 10px; color: var(--tx-meta); flex: none; }
.lv-menu .mi .chk { width: 12px; height: 12px; flex: none; }
.lv-menu .mi .chk.off { visibility: hidden; }
.lv-menu .sep { height: 1px; margin: 5px 10px; background: var(--hairline); }
.lv-menu.sub { width: 236px; top: auto; }

@media (prefers-reduced-motion: reduce) {
  .lv-root.is-hidden .lv-stack { transform: none; }
  .bead:active, .btn-copy:active { transform: none; }
}
</style>
</head>
<body>
<script src="../shared/mock-data.js"></script>
<script src="../shared/stage.js"></script>
<script>
(() => {
  "use strict";
  const MOCK = window.LV_MOCK;
  const LVH = window.LV;
  const params = new URLSearchParams(location.search);
  const HOLD = params.get("hold") === "1";
  const rmq = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  const reduced = () => rmq.matches;

  // ---------------------------------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------------------------------
  const DICT = MOCK.history[0];                                       // what this dictation becomes: 118 words, 0:41
  const FAIL = MOCK.history.find((h) => !h.delivered) || DICT;        // the one that did not land: 189 words, 1:06
  let micName = MOCK.mics[0].name;
  const TARGET = DICT.target;                                         // "c11"
  // Streaming preview: livePreview[0] is the opening of this dictation as the recogniser streams it
  // (lower case, no punctuation); the rest of history[0] follows in the same streaming shape.
  const STREAM = (MOCK.livePreview[0] + " " + DICT.text.split(/(?<=\.)\s+/).slice(1).join(" "))
    .toLowerCase().replace(/[.,]/g, "").split(/\s+/).filter(Boolean);
  const WORDS_PER_SEC = DICT.words / DICT.seconds;                    // 2.88 w/s, the owner's real pace
  const STREAM_CHUNK_MS = 480;                                        // recogniser emits a partial every ~0.5 s

  // ---------------------------------------------------------------------------------------------
  // Icons. Inline stand-ins for SF Symbols; the native build uses the named symbol.
  // 16-unit grid, 1.5 stroke (= 1.5 pt at 16 pt), round caps and joins.
  // ---------------------------------------------------------------------------------------------
  const sv = (body, cls = "gl") => `<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const ICON = {
    // SF Symbol: clock.arrow.circlepath
    history: (c) => sv(`<path d="M3.53 5.63A5.6 5.6 0 1 1 3.75 10.8"/><path d="M5.97 4.73 3.53 5.63 2.63 3.19"/><path d="M8.6 5.3v2.9l1.9 1.2"/>`, c),
    // SF Symbol: doc.on.doc
    copy: (c) => sv(`<rect x="2.75" y="5.25" width="8" height="9" rx="1.8"/><path d="M5.25 5.25V3.55c0-1 .8-1.8 1.8-1.8h5.4c1 0 1.8.8 1.8 1.8v6.4c0 1-.8 1.8-1.8 1.8h-1.7"/>`, c),
    // SF Symbol: xmark
    cancel: (c) => sv(`<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>`, c),
    // SF Symbol: arrow.clockwise
    reprocess: (c) => sv(`<path d="M13.17 6.72A5.5 5.5 0 1 1 7.52 3.12"/><path d="M5.6 1.5l1.92 1.62L5.9 5"/>`, c),
    // SF Symbol: checkmark
    check: (c) => sv(`<path d="M3.8 8.4l2.9 2.8 5.6-6.3"/>`, c),
    // SF Symbol: exclamationmark.circle
    warn: (c) => sv(`<circle cx="8" cy="8" r="6.25"/><path d="M8 4.9v3.7"/><circle cx="8" cy="11.1" r=".35" fill="currentColor"/>`, c),
    // SF Symbol: mic
    mic: (c) => sv(`<rect x="5.8" y="1.8" width="4.4" height="7.6" rx="2.2"/><path d="M3.9 7.6a4.1 4.1 0 0 0 8.2 0M8 11.7v2.3"/>`, c),
    // SF Symbol: chevron.right
    chev: (c) => sv(`<path d="M6 3.5 10.5 8 6 12.5"/>`, c),
  };
  // Target app icon stand-in (the real build draws NSWorkspace.shared.icon(forFile:) of the target app).
  const C11_ICON = `<svg class="lv-appicon" viewBox="0 0 20 20" aria-label="c11"><defs><linearGradient id="lvc11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303647"/><stop offset="1" stop-color="#11141B"/></linearGradient></defs><rect x=".5" y=".5" width="19" height="19" rx="4.6" fill="url(#lvc11)" stroke="rgba(255,255,255,.22)"/><path d="M5.3 6.9 8.3 10l-3 3.1" fill="none" stroke="#8FB3FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 13.1h4.4" stroke="#D8DDE8" stroke-width="1.6" stroke-linecap="round"/></svg>`;

  // ---------------------------------------------------------------------------------------------
  // Trace palette per appearance (mirrors DIRECTION.md tokens)
  // ---------------------------------------------------------------------------------------------
  const PAL = {
    dark: {
      spectrum: [[0, "#8E7CFF"], [0.62, "#7FD4FF"], [1, "#9FEFFF"]],   // oldest violet -> newest cyan-white
      grain: "lighter", grainAlpha: 0.35, meniscus: 0.55,
      bloom: 0.5, core: 1, settled: 0.32,
      head: [220, 252, 255], headAlpha: 0.6,
      sweep: [226, 251, 255], sweepAlpha: 0.9,
      ok: "#8FE8B8", fail: [255, 255, 255], failAlpha: 0.26,
    },
    light: {
      spectrum: [[0, "#6F63F0"], [0.5, "#3AA6FF"], [1, "#2AD3E8"]],   // deeper so it holds contrast on light glass
      grain: "source-over", grainAlpha: 0.35, meniscus: 0.6,
      bloom: 0.45, core: 1, settled: 0.38,
      head: [42, 211, 232], headAlpha: 0.5,
      sweep: [12, 150, 235], sweepAlpha: 0.95,
      ok: "#2FBF7E", fail: [20, 24, 40], failAlpha: 0.22,
    },
  };

  // ---------------------------------------------------------------------------------------------
  // Geometry of the trace (matches the anatomy: 65 samples, 2+2 px pitch, heights 2..40 in a 260x44 frame)
  // ---------------------------------------------------------------------------------------------
  const TR = { W: 260, H: 44, MID: 22, N: 65, PITCH: 4, HMIN: 2, HMAX: 40, PAD: 14, PERIOD: 85, FEATHER: 12 };
  const XHEAD = TR.W - 2;   // write head

  // Signal path from the contract: threshold 0.4, exponent 1.15, grain from two incommensurate cosines.
  function heightFor(level, n) {
    const adjusted = Math.min(1, Math.max(0, (level - 0.4) / 0.6));
    const amplified = Math.pow(adjusted, 1.15);
    const grain = 0.6 + 0.25 * Math.cos(1.7 * n) + 0.15 * Math.cos(4.3 * n);
    return Math.min(TR.HMAX, Math.max(TR.HMIN, TR.HMIN + (TR.HMAX - TR.HMIN) * amplified * grain));
  }
  const fade = (t) => 0.35 + 0.65 * Math.pow(t, 1.4);                      // age fade, t = 0 oldest .. 1 newest
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const easeOut = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const lerp = (a, b, t) => a + (b - a) * t;
  function spectrumAt(stops, t) {
    for (let i = 0; i < stops.length - 1; i++) {
      const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
      if (t <= t1) { const k = (t - t0) / (t1 - t0), a = hex(c0), b = hex(c1); return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    }
    return hex(stops[stops.length - 1][1]);
  }

  // ---------------------------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------------------------
  let built = false;
  let theme = "dark";
  let stageState = null;
  const el = {};
  const timers = {};

  // Dictation session: the clock, the streamed words, what "delivered" reports.
  const session = { t0: 0, frozen: null, words: 0, shownSec: -1, lastChunk: 0, active: false, ran: false };

  // Trace buffer: committed heights oldest-first, the live head, and the scroll phase.
  const trace = {
    h: new Float32Array(TR.N).fill(TR.HMIN),
    n: 0, lastCommit: 0, acc: 0, accN: 0, head: TR.HMIN, phase: 0,
    mode: "live", modeAt: 0, frozenE: null, frozenPhase: 0, frozenHead: TR.HMIN,
    level: 0, ownT0: 0,
  };

  // ---------------------------------------------------------------------------------------------
  // Build
  // ---------------------------------------------------------------------------------------------
  function build() {
    if (built) return;
    built = true;
    const host = LVStage.host();
    host.insertAdjacentHTML("beforeend", `
      <div class="lv-root is-hidden" id="lv-root" data-shape="base">
        <div class="lv-stack" id="lv-stack">
          <div class="lv-rail lead">
            <button class="bead lv-glass lv-edge" id="chip-history" title="Recent Dictations" aria-label="Recent Dictations">${ICON.history("gl gl-main")}</button>
            <button class="bead lv-glass lv-edge" id="chip-copy" title="Copy Last Transcription" aria-label="Copy Last Transcription"><span class="bloom"></span>${ICON.copy("gl gl-main")}${ICON.check("gl gl-alt")}</button>
          </div>
          <div class="lv-pill lv-glass lv-edge" id="lv-pill">
            <div class="lv-upper">
              <div class="face face-live on" id="face-live">
                <div class="meta-row"><span class="mic">${ICON.mic("")}<span id="lv-mic"></span></span><span class="timer" id="lv-timer">0:00</span></div>
                <div class="preview"><p id="lv-preview"></p></div>
              </div>
              <div class="face face-delivered" id="face-delivered">
                <div class="d-line">${ICON.check("d-check")}<span><span class="d-main">Delivered to ${TARGET}</span><span class="d-meta" id="lv-dmeta"></span></span></div>
              </div>
              <div class="face face-failed" id="face-failed">
                <div class="f-head">${ICON.warn("")}<span>Couldn’t paste into ${FAIL.target}</span></div>
                <p class="f-text" id="lv-ftext"></p>
                <div class="f-actions">
                  <button class="btn-copy lv-edge" id="f-copy"><span class="lbl l-copy">${ICON.copy("")}Copy</span><span class="lbl l-done">${ICON.check("")}Copied</span></button>
                  <button class="btn-text" id="f-dismiss">Dismiss</button>
                  <span class="f-meta">${FAIL.words} words · ${LVH.fmtDuration(FAIL.seconds)}</span>
                </div>
              </div>
            </div>
            <div class="lv-trace-row">
              <span title="Dictation target app">${C11_ICON}</span>
              <div class="lv-trace"><canvas id="lv-canvas"></canvas></div>
            </div>
          </div>
          <div class="lv-rail trail">
            <button class="bead lv-glass lv-edge" id="chip-cancel" title="Cancel Dictation" aria-label="Cancel Dictation">${ICON.cancel("gl gl-main")}</button>
            <button class="bead lv-glass lv-edge" id="chip-reprocess" title="Reprocess Last Dictation" aria-label="Reprocess Last Dictation">${ICON.reprocess("gl gl-main")}</button>
          </div>
        </div>
        <div class="lv-history lv-edge" id="lv-history" data-nodrag role="dialog" aria-label="Recent Dictations">
          <div class="h-head"><span class="lbl-caps">Recent dictations</span><span class="h-hint">Click to insert</span></div>
          <div class="h-list" id="lv-hlist"></div>
        </div>
      </div>`);
    for (const id of ["lv-root", "lv-stack", "lv-pill", "face-live", "face-delivered", "face-failed", "lv-mic", "lv-timer",
      "lv-preview", "lv-dmeta", "lv-ftext", "f-copy", "f-dismiss", "lv-history", "lv-hlist", "lv-canvas",
      "chip-history", "chip-copy", "chip-cancel", "chip-reprocess"]) el[id] = document.getElementById(id);
    el["lv-mic"].textContent = micName;
    el["lv-ftext"].textContent = FAIL.text;
    buildHistory();
    buildCanvas();
    buildMenubar();
    wire();
    LVStage.makeDraggable(el["lv-root"], "lumen");
    requestAnimationFrame(frame);
  }

  function buildHistory() {
    const rows = MOCK.history.slice(0, 12);
    let html = "", lastDay = "";
    rows.forEach((h, i) => {
      const day = LVH.fmtDay(h.when);
      if (day !== lastDay) { html += `<div class="h-sec lbl-caps">${day}</div>`; lastDay = day; }
      const nd = h.delivered ? "" : ` · <span class="nd">Not delivered</span>`;
      html += `<button class="h-row" data-i="${i}" title="Insert this dictation into the focused app">
        <span class="h-text">${escapeHtml(h.text)}</span>
        <span class="h-meta">${LVH.fmtTime(h.when)} · ${LVH.fmtDuration(h.seconds)} · ${h.words} words · ${h.target}${nd}</span></button>`;
    });
    el["lv-hlist"].innerHTML = html;
  }
  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------------------------------------------------------------------------------------------
  // Overlay visibility
  // ---------------------------------------------------------------------------------------------
  function show() { el["lv-root"].classList.remove("is-hidden"); }
  function hide() { el["lv-root"].classList.add("is-hidden"); }
  function setFace(name) {
    for (const f of ["live", "delivered", "failed"]) el["face-" + f].classList.toggle("on", f === name);
    el["lv-root"].dataset.shape = name === "failed" ? "tall" : "base";
  }

  // ---------------------------------------------------------------------------------------------
  // Session: clock, streamed words, head-truncated preview
  // ---------------------------------------------------------------------------------------------
  function startSession(prerollSec) {
    const now = performance.now();
    session.t0 = now - prerollSec * 1000;
    session.frozen = null; session.words = -1; session.shownSec = -1; session.lastChunk = 0; session.active = true; session.ran = false;
    resetTrace(now, prerollSec);
    tickText(now, true);
  }
  function elapsed(now) { return session.frozen != null ? session.frozen : Math.max(0, (now - session.t0) / 1000); }
  function freezeSession(now) {
    if (session.active) { session.frozen = elapsed(now); session.active = false; session.ran = true; }
  }

  function tickText(now, force) {
    const e = elapsed(now);
    const sec = Math.floor(e);
    if (sec !== session.shownSec) { session.shownSec = sec; el["lv-timer"].textContent = LVH.fmtDuration(sec); }
    if (!session.active && !force) return;
    if (!force && now - session.lastChunk < STREAM_CHUNK_MS) return;
    session.lastChunk = now;
    const words = Math.min(STREAM.length, Math.floor(e * WORDS_PER_SEC));
    if (words !== session.words) { session.words = words; fitPreview(STREAM.slice(0, words)); }
  }

  // Head truncation: keep the newest words, prefix an ellipsis, never exceed 3 lines (54 px).
  // Native: Text(tail).lineLimit(3).truncationMode(.head).
  function fitPreview(words) {
    const p = el["lv-preview"];
    const maxH = 18 * 3 + 1;
    const set = (s) => { p.textContent = (s > 0 ? "…" : "") + words.slice(s).join(" "); return p.offsetHeight <= maxH; };
    if (set(0)) return;
    let lo = 1, hi = words.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (set(m)) hi = m; else lo = m + 1; }
    set(lo);
  }

  // ---------------------------------------------------------------------------------------------
  // Trace
  // ---------------------------------------------------------------------------------------------
  let ctx, off, octx, DPR = 1, CW = 0, CH = 0;
  const grads = {};
  function buildCanvas() {
    const c = el["lv-canvas"];
    DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    CW = TR.W + TR.PAD * 2; CH = TR.H + TR.PAD * 2;
    c.width = Math.round(CW * DPR); c.height = Math.round(CH * DPR);
    ctx = c.getContext("2d");
    off = document.createElement("canvas"); off.width = c.width; off.height = c.height;
    octx = off.getContext("2d");
    makeGradients();
  }
  // Horizontal colour: the spectral accent with the contract's age fade and a 12 px feather at the oldest edge.
  // [CA] CAGradientLayer(.axial, start (0, .5), end (1, .5)) whose colours carry the same alpha stops.
  function makeGradients() {
    if (!ctx) return;
    const P = PAL[theme];
    const hgrad = (alphaFn, colorFn) => {
      const g = ctx.createLinearGradient(TR.PAD, 0, TR.PAD + TR.W, 0);   // canvas space: trace x 0 sits at PAD
      for (let k = 0; k <= 24; k++) {
        const t = k / 24, x = t * TR.W, [r, gg, b] = colorFn(t);
        const a = alphaFn(t) * smooth(0, TR.FEATHER, x);
        g.addColorStop(t, `rgba(${r | 0},${gg | 0},${b | 0},${a.toFixed(4)})`);
      }
      return g;
    };
    const spec = (t) => spectrumAt(P.spectrum, t);
    grads.fill = hgrad(fade, spec);
    grads.grain = hgrad((t) => P.grainAlpha * fade(t), (t) => theme === "dark" ? spectrumAt(P.spectrum, t).map((v) => lerp(v, 255, 0.35)) : spectrumAt(P.spectrum, t).map((v) => v * 0.72));
    grads.settled = hgrad((t) => P.settled * (0.55 + 0.45 * t), spec);
    grads.ok = hgrad((t) => 0.55 + 0.45 * t, () => hex(P.ok));
    grads.fail = hgrad(() => P.failAlpha, () => P.fail);
    // Vertical mask: accent at the midline -> nearly transparent at the extremes. [CA] a vertical CAGradientLayer as the mask.
    const v = octx.createLinearGradient(0, TR.PAD, 0, TR.PAD + TR.H);
    v.addColorStop(0, "rgba(0,0,0,0.18)"); v.addColorStop(0.28, "rgba(0,0,0,0.62)");
    v.addColorStop(0.5, "rgba(0,0,0,1)"); v.addColorStop(0.72, "rgba(0,0,0,0.62)"); v.addColorStop(1, "rgba(0,0,0,0.18)");
    grads.vmask = v;
  }

  function resetTrace(now, prerollSec) {
    trace.h.fill(TR.HMIN); trace.head = TR.HMIN; trace.acc = 0; trace.accN = 0; trace.phase = 0;
    trace.lastCommit = now; trace.ownT0 = now; trace.n = 0;
    trace.mode = "live"; trace.modeAt = now;
    if (prerollSec > 0) {
      // Pre-roll: fill the buffer with the envelope the last ~5.5 s of a dictation would have produced.
      const tEnd = 17.0, start = tEnd - TR.N * TR.PERIOD / 1000;
      for (let i = 0; i < TR.N; i++) {
        let s = 0; for (let k = 0; k < 5; k++) s = Math.max(s, LVStage.envelope(start + (i * TR.PERIOD + k * 17) / 1000));
        trace.h[i] = heightFor(s, trace.n++);
      }
      trace.head = trace.h[TR.N - 1];
    }
  }

  function setTraceMode(mode, now) {
    // Freeze whatever is on screen so the next mode can ease from it.
    trace.frozenE = currentEnvelope();
    trace.frozenPhase = trace.phase;
    trace.frozenHead = trace.head;
    trace.mode = mode; trace.modeAt = now;
  }

  // The liquid body: a max-biased smoothing of the samples (60% local max of 3, 40% 1-2-1 average), so the body
  // swells around each syllable and holds most grain lines inside it; the grain lines keep the raw heights.
  function currentEnvelope() {
    const h = trace.h, N = TR.N, e = new Float32Array(N + 1);
    for (let i = 0; i < N; i++) {
      const a = h[Math.max(0, i - 1)], c = i + 1 < N ? h[i + 1] : trace.head;
      e[i] = lerp((a + 2 * h[i] + c) / 4, Math.max(a, h[i], c), 0.6);
    }
    e[N] = lerp((h[N - 1] + 3 * trace.head) / 4, Math.max(h[N - 1], trace.head), 0.6);
    return e;
  }

  function stepLive(now, dt) {
    const level = stageState === "listening" ? trace.level : LVStage.envelope(((now - trace.ownT0) / 1000) % 60);
    // one sample per 85 ms (the real tap's 4096-frame buffer); within a sample we hold the peak level
    trace.acc = Math.max(trace.acc, level); trace.accN++;
    if (now - trace.lastCommit >= TR.PERIOD) {
      // commit what the head has drawn so the handover is seamless, then open a new sample
      trace.h.copyWithin(0, 1); trace.h[TR.N - 1] = trace.head; trace.n++;
      trace.acc = level; trace.accN = 1;
      trace.lastCommit += TR.PERIOD;
      if (now - trace.lastCommit > TR.PERIOD) trace.lastCommit = now;   // resync after a stall
    }
    trace.phase = Math.min(1, (now - trace.lastCommit) / TR.PERIOD);
    const target = heightFor(trace.acc, trace.n);
    trace.head += (target - trace.head) * Math.min(1, dt / 60);          // 60 ms linear-ish settle
  }

  // Monotone cubic (Fritsch–Carlson) through (xs, ys): no overshoot, so the mirrored halves never cross.
  function monotone(path, xs, ys, move) {
    const n = xs.length, d = new Array(n - 1), m = new Array(n);
    for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
    }
    if (move) path.moveTo(xs[0], ys[0]); else path.lineTo(xs[0], ys[0]);
    for (let i = 0; i < n - 1; i++) {
      const h = xs[i + 1] - xs[i];
      path.bezierCurveTo(xs[i] + h / 3, ys[i] + m[i] * h / 3, xs[i + 1] - h / 3, ys[i + 1] - m[i + 1] * h / 3, xs[i + 1], ys[i + 1]);
    }
  }

  function envelopePath(xs, es) {
    const MID = TR.MID + TR.PAD;
    const top = es.map((e) => MID - e / 2), bot = es.map((e) => MID + e / 2);
    const p = new Path2D();
    monotone(p, xs, top, true);
    const xh = xs[xs.length - 1], yT = top[top.length - 1], yB = bot[bot.length - 1], k = Math.min(3, (yB - yT) / 2);
    p.bezierCurveTo(xh + k, yT, xh + k, yB, xh, yB);                   // rounded write head
    monotone(p, xs.slice().reverse(), bot.slice().reverse(), false);
    p.closePath();
    return p;
  }

  function drawTrace(now) {
    const P = PAL[theme];
    const c = ctx, o = octx, X0 = TR.PAD, MID = TR.MID + TR.PAD;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, c.canvas.width, c.canvas.height);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ---- geometry for this frame
    const mode = trace.mode;
    const live = mode === "live";
    let E, phase, raw;
    if (live) { E = currentEnvelope(); phase = trace.phase; raw = trace.h; }
    else {
      const f = reduced() ? 1 : easeOut((now - trace.modeAt) / 180);   // flatten 180 ms ease-out
      E = trace.frozenE ? trace.frozenE.map((e) => lerp(e, TR.HMIN, f)) : new Float32Array(TR.N + 1).fill(TR.HMIN);
      phase = trace.frozenPhase; raw = null;
    }
    const xs = [], es = [];
    for (let i = 0; i < TR.N; i++) {
      const x = XHEAD - TR.PITCH * (TR.N - 1 - i) - TR.PITCH * phase;
      if (i === TR.N - 1 && TR.PITCH * phase < 0.5) continue;           // coincides with the head
      xs.push(X0 + x); es.push(E[i]);
    }
    xs.push(X0 + XHEAD); es.push(E[TR.N]);
    const path = envelopePath(xs, es);

    const fillWith = (style, alpha, bloomAlpha, masked) => {
      // bloom: a blurred copy at 0.5 behind the body. [CA] the shape layer's own shadow (radius 6, opacity 0.5, offset 0).
      if (bloomAlpha > 0.001) {
        c.save(); c.globalAlpha = bloomAlpha;
        if ("filter" in c) c.filter = "blur(5px)"; else { c.shadowColor = "rgba(127,212,255,0.8)"; c.shadowBlur = 10; }
        c.fillStyle = style; c.fill(path); c.restore();
      }
      // body: horizontal colour, then the vertical alpha mask (destination-in). [CA] gradient layer masked by the path, masked again by a vertical gradient.
      o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, off.width, off.height);
      o.setTransform(DPR, 0, 0, DPR, 0, 0);
      o.fillStyle = style; o.fill(path);
      if (masked) { o.globalCompositeOperation = "destination-in"; o.fillStyle = grads.vmask; o.fillRect(0, 0, CW, CH); o.globalCompositeOperation = "source-over"; }
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = alpha; c.drawImage(off, 0, 0); c.restore();
    };

    if (live) {
      fillWith(grads.fill, 1, P.bloom, true);
      // meniscus: a 0.75 px surface line where light catches the liquid's edge. [CA] the same path as a stroked CAShapeLayer, gradient-masked.
      c.save(); c.globalCompositeOperation = P.grain; c.globalAlpha = P.meniscus;
      c.strokeStyle = grads.fill; c.lineWidth = 0.75; c.lineJoin = "round"; c.stroke(path); c.restore();
      // fine vertical grain at the 65 sample positions, raw heights, 1 px, accent 0.35
      c.save(); c.globalCompositeOperation = P.grain;
      c.strokeStyle = grads.grain; c.lineWidth = 1; c.lineCap = "butt";
      c.beginPath();
      for (let i = 0; i < TR.N; i++) {
        const x = XHEAD - TR.PITCH * (TR.N - 1 - i) - TR.PITCH * phase, h = raw[i];
        if (x < 0) continue;
        c.moveTo(X0 + x, MID - h / 2); c.lineTo(X0 + x, MID + h / 2);
      }
      c.stroke(); c.restore();
      // write head: a small specular point where the voice enters the lens
      const hr = 3 + trace.head * 0.12, lvl = Math.min(1, (trace.head - TR.HMIN) / 20);
      const g = c.createRadialGradient(X0 + XHEAD, MID, 0, X0 + XHEAD, MID, hr);
      const [r, gg, b] = P.head;
      g.addColorStop(0, `rgba(${r},${gg},${b},${(P.headAlpha * (0.55 + 0.45 * lvl)).toFixed(3)})`);
      g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      c.save(); c.globalCompositeOperation = theme === "dark" ? "lighter" : "source-over"; c.fillStyle = g;
      c.fillRect(X0 + XHEAD - hr, MID - hr, hr * 2, hr * 2); c.restore();
      return;
    }

    const since = now - trace.modeAt;
    if (mode === "sweep") {
      const k = reduced() ? 1 : easeOut(since / 180);
      fillWith(grads.fill, lerp(1, 0, k), P.bloom * (1 - k), true);   // live colour drains away as it flattens
      fillWith(grads.settled, k, 0, false);
      // the sweep: a highlight crossing the flat line every 1.05 s, linear. [CA] CAGradientLayer locations animation.
      const period = 1050;
      if (reduced()) {
        const a = 0.35 + 0.25 * Math.sin((since / 1600) * Math.PI * 2);   // reduced motion: a slow breath instead of travel
        fillWith(grads.settled, a, 0, false);
      } else {
        const ph = ((since % period) / period);
        const cx = lerp(-0.16, 1.16, ph) * TR.W, half = 0.18 * TR.W;
        const [r, gg, b] = P.sweep;
        const g = c.createLinearGradient(X0 + cx - half, 0, X0 + cx + half, 0);
        g.addColorStop(0, `rgba(${r},${gg},${b},0)`); g.addColorStop(0.5, `rgba(${r},${gg},${b},${P.sweepAlpha})`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        c.save();
        c.beginPath(); c.rect(X0 + TR.FEATHER * 0.5, MID - 8, TR.W - TR.FEATHER * 0.5, 16); c.clip();
        c.globalAlpha = k;
        if ("filter" in c) { c.filter = "blur(3px)"; c.fillStyle = g; c.globalAlpha = 0.55 * k; c.fillRect(X0 + cx - half, MID - 2.5, half * 2, 5); c.filter = "none"; }
        c.globalAlpha = k; c.fillStyle = g; c.fill(path);
        c.restore();
      }
      return;
    }
    if (mode === "ok") {
      const k = reduced() ? 1 : easeOut(since / 240);                     // flush to the green-tinted glow
      fillWith(grads.settled, 1 - k, 0, false);
      fillWith(grads.ok, k, P.bloom * 1.3 * k, false);
      return;
    }
    if (mode === "fail") { fillWith(grads.fail, 1, 0, false); return; }
  }

  // ---------------------------------------------------------------------------------------------
  // Frame loop (one rAF drives trace, text, menu bar glyph). Native: TimelineView(.animation) at 60 fps.
  // ---------------------------------------------------------------------------------------------
  let lastNow = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = lastNow ? Math.min(100, now - lastNow) : 16; lastNow = now;
    const visible = !el["lv-root"].classList.contains("is-hidden");
    if (trace.mode === "live" && (stageState === "listening" || stageState === "history")) stepLive(now, dt);
    if (visible || trace.drawOnce) { drawTrace(now); trace.drawOnce = false; }
    if (session.active) tickText(now);
    tickMenubar(now);
  }

  // ---------------------------------------------------------------------------------------------
  // Chips, card, failed actions
  // ---------------------------------------------------------------------------------------------
  function flashDone(node, ms) {
    clearTimeout(node._t);
    node.classList.remove("is-done"); void node.offsetWidth; node.classList.add("is-done");
    node._t = setTimeout(() => node.classList.remove("is-done"), ms);
  }
  function copyText(t) { try { navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {}); } catch (_) {} }

  function openHistory() { el["lv-history"].classList.add("open"); el["chip-history"].setAttribute("aria-expanded", "true"); }
  function closeHistory() { el["lv-history"].classList.remove("open"); el["chip-history"].setAttribute("aria-expanded", "false"); }
  const historyOpen = () => el["lv-history"].classList.contains("open");

  function wire() {
    el["chip-history"].addEventListener("click", () => {
      if (historyOpen()) { closeHistory(); if (stageState === "history") LVStage.setState("listening"); }
      else if (stageState === "listening") LVStage.setState("history");
      else openHistory();
    });
    el["chip-copy"].addEventListener("click", () => { copyText(DICT.text); flashDone(el["chip-copy"], 900); });
    el["chip-cancel"].addEventListener("click", () => { LVStage.stopSequence(); LVStage.setState("idle"); });
    el["chip-reprocess"].addEventListener("click", () => {
      LVStage.stopSequence(); LVStage.setState("transcribing");
      clearTimeout(timers.reprocess);
      timers.reprocess = setTimeout(() => { if (LVStage.state === "transcribing") LVStage.setState("delivered"); }, 1100);
    });
    el["f-copy"].addEventListener("click", () => { copyText(FAIL.text); flashDone(el["f-copy"], 1400); });
    el["f-dismiss"].addEventListener("click", () => LVStage.setState("idle"));
    el["lv-hlist"].addEventListener("click", (e) => {
      const row = e.target.closest(".h-row"); if (!row) return;
      const h = MOCK.history[+row.dataset.i];
      row.classList.add("is-picked");
      LVStage.insertText(escapeHtml(h.text.slice(0, 90)) + "…");
      setTimeout(() => { row.classList.remove("is-picked"); closeHistory(); if (stageState === "history") LVStage.setState("listening"); }, 140);
    });
    // outside click closes the card (the prototype controls are not part of the screen)
    document.addEventListener("mousedown", (e) => {
      if (!historyOpen()) return;
      const t = e.target;
      if (el["lv-history"].contains(t) || el["chip-history"].contains(t) || t.closest("#lv-controls") || t.closest(".lv-menu") || t.closest(".lv-status")) return;
      closeHistory(); if (stageState === "history") LVStage.setState("listening");
    }, true);
  }

  function updateChips(state) {
    const processing = state === "transcribing";
    for (const id of ["chip-copy", "chip-reprocess"]) el[id].setAttribute("aria-disabled", processing ? "true" : "false");
  }

  // ---------------------------------------------------------------------------------------------
  // Menu bar item: the liquid line. A 1.24 pt line runs the width of the glyph and swells into two lobes (the old
  // twin-peak five-bar mark, made liquid). Template image, mono. Listening: the lobes breathe with the level, out of step.
  // Transcribing: dims to 45%. Native: NSStatusItem.button.image = template NSImage drawn from this path; while listening
  // an NSImage is re-rendered at 30 fps (or a CAShapeLayer in the button's layer).
  // ---------------------------------------------------------------------------------------------
  const mb = { la: 0, lb: 0, last: 0, moving: false };
  const MB_REST = [3.6, 2.4];
  function mbPath(a1, a2) {
    const top = [], bot = [], r = 0.62;
    for (let i = 0; i <= 48; i++) {
      const x = 1.6 + i * (12.8 / 48);
      const h = r + a1 * Math.exp(-(((x - 5.5) / 1.55) ** 2)) + a2 * Math.exp(-(((x - 10.5) / 1.45) ** 2));
      top.push(`${x.toFixed(2)} ${(8 - h).toFixed(2)}`); bot.push(`${x.toFixed(2)} ${(8 + h).toFixed(2)}`);
    }
    return `M${top.join("L")}A${r} ${r} 0 0 1 ${bot[bot.length - 1]}L${bot.reverse().join("L")}A${r} ${r} 0 0 1 ${top[0]}Z`;
  }
  function buildMenubar() {
    const slot = LVStage.menubarSlot();
    slot.innerHTML = `<span class="lv-status" id="lv-status" role="button" aria-haspopup="menu" aria-label="Liquid Voice">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path id="lv-mb-wave" fill="currentColor" d="${mbPath(...MB_REST)}"/></svg></span>`;
    el.status = document.getElementById("lv-status");
    el.mbWave = document.getElementById("lv-mb-wave");
    buildMenu();
    el.status.addEventListener("mousedown", (e) => { e.preventDefault(); e.stopPropagation(); toggleMenu(); });
    if (params.get("menu") === "1") setTimeout(() => { openMenu(); if (params.get("sub") === "1") openSub(document.getElementById("lv-mi-mic")); }, 50);
  }
  function tickMenubar(now) {
    const listening = stageState === "listening" || stageState === "history";
    if (!listening || reduced()) {
      if (mb.moving) { mb.moving = false; el.mbWave.setAttribute("d", mbPath(...MB_REST)); }
      return;
    }
    if (now - mb.last < 33) return;
    mb.last = now; mb.moving = true;
    const lv = Math.min(1, Math.max(0, (trace.head - TR.HMIN) / 26));
    mb.la += (lv - mb.la) * 0.35; mb.lb += (lv - mb.lb) * 0.18;             // two time constants: the lobes breathe out of step
    el.mbWave.setAttribute("d", mbPath(1.9 + 3.3 * mb.la, 1.2 + 2.9 * mb.lb));
  }
  function updateMenubar(state) { el.status.classList.toggle("is-dim", state === "transcribing"); }

  // NSMenu. Only the rows' text is ours natively; the glass and highlight here imitate the system menu.
  function buildMenu() {
    const m = document.createElement("div");
    m.className = "lv-menu lv-edge"; m.id = "lv-menu"; m.setAttribute("role", "menu");
    m.innerHTML = `
      <div class="mi" data-act="start"><span>Start Dictation</span><span class="sp"></span><kbd>⌥Space</kbd></div>
      <div class="mi" data-act="mic" id="lv-mi-mic"><span>Microphone</span><span class="sp"></span><span class="val" id="lv-mi-micval"></span>${ICON.chev("chev")}</div>
      <div class="mi" data-act="history"><span>History…</span></div>
      <div class="mi" data-act="settings"><span>Settings…</span><span class="sp"></span><kbd>⌘,</kbd></div>
      <div class="sep"></div>
      <div class="mi" data-act="quit"><span>Quit Liquid Voice</span><span class="sp"></span><kbd>⌘Q</kbd></div>`;
    const sub = document.createElement("div");
    sub.className = "lv-menu sub lv-edge"; sub.id = "lv-submenu"; sub.setAttribute("role", "menu");
    document.body.append(m, sub);
    el.menu = m; el.sub = sub;
    renderMics();
    m.addEventListener("click", (e) => {
      const mi = e.target.closest(".mi"); if (!mi) return;
      const act = mi.dataset.act;
      if (act === "mic") return;
      closeMenu();
      if (act === "start") { LVStage.stopSequence(); LVStage.setState("listening"); }
      if (act === "history") { if (stageState === "listening") LVStage.setState("history"); else openHistory(); }
    });
    const micRow = m.querySelector("#lv-mi-mic");
    micRow.addEventListener("mouseenter", () => openSub(micRow));
    m.addEventListener("mouseover", (e) => { const mi = e.target.closest(".mi"); if (mi && mi !== micRow) closeSub(); });
    sub.addEventListener("click", (e) => {
      const mi = e.target.closest(".mi"); if (!mi) return;
      micName = mi.dataset.mic; el["lv-mic"].textContent = micName; renderMics(); closeMenu();
    });
    document.addEventListener("mousedown", (e) => { if (m.classList.contains("open") && !m.contains(e.target) && !sub.contains(e.target)) closeMenu(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
  }
  function renderMics() {
    document.getElementById("lv-mi-micval").textContent = micName;
    el.sub.innerHTML = MOCK.mics.map((mc) => `<div class="mi" data-mic="${mc.name}">${ICON.check("chk" + (mc.name === micName ? "" : " off"))}<span>${mc.name}</span></div>`).join("");
  }
  function toggleMenu() { el.menu.classList.contains("open") ? closeMenu() : openMenu(); }
  function openMenu() {
    const r = el.status.getBoundingClientRect();
    const w = 292, left = Math.min(r.left, window.innerWidth - w - 6);
    el.menu.style.left = left + "px";
    el.menu.classList.add("open"); el.status.classList.add("open");
  }
  function closeMenu() { el.menu.classList.remove("open"); el.status.classList.remove("open"); closeSub(); }
  function openSub(row) {
    const mr = el.menu.getBoundingClientRect(), rr = row.getBoundingClientRect(), w = 236;
    const left = mr.right + w + 4 < window.innerWidth ? mr.right - 3 : mr.left - w + 3;
    el.sub.style.left = left + "px"; el.sub.style.top = (rr.top - 5) + "px";
    el.sub.classList.add("open"); row.classList.add("hot");
  }
  function closeSub() { el.sub.classList.remove("open"); const r = document.getElementById("lv-mi-mic"); if (r) r.classList.remove("hot"); }

  // ---------------------------------------------------------------------------------------------
  // Stage wiring
  // ---------------------------------------------------------------------------------------------
  let firstState = true;
  function onState(next, prev) {
    build();
    const now = performance.now();
    const initial = firstState; firstState = false;
    stageState = next;
    clearTimeout(timers.delivered);
    if (next !== "transcribing") clearTimeout(timers.reprocess);
    if (next === "history") openHistory(); else closeHistory();
    const wasLive = prev === "listening" || prev === "history";

    switch (next) {
      case "idle":
        freezeSession(now);
        hide();
        LVStage.clearInserted();
        break;

      case "listening":
      case "history":
        if (!wasLive) startSession(initial ? 10 : 0);   // first load lands mid-dictation so the view is representative
        if (trace.mode !== "live") { trace.mode = "live"; trace.modeAt = now; }
        setFace("live");
        el["face-live"].classList.remove("is-settled");
        show();
        break;

      case "transcribing":
        if (wasLive) freezeSession(now);
        else if (!session.ran) { startSession(0); session.words = -1; fitPreview(STREAM.slice(0, 44)); session.frozen = DICT.seconds; session.active = false; session.ran = false; }
        tickText(now, false);
        setTraceMode("sweep", now);
        setFace("live");
        el["face-live"].classList.add("is-settled");                     // the words settle; only the sweep moves
        show();
        break;

      case "delivered": {
        const fromSession = session.ran && session.frozen >= 1;
        const secs = fromSession ? Math.round(session.frozen) : DICT.seconds;
        const words = fromSession ? Math.max(1, session.words) : DICT.words;
        el["lv-dmeta"].textContent = ` · ${words} words · ${LVH.fmtDuration(secs)}`;
        if (trace.mode === "live") setTraceMode("ok", now); else { trace.frozenE = null; trace.mode = "ok"; trace.modeAt = now; }
        setFace("delivered");
        show();
        LVStage.insertText(escapeHtml(DICT.text.slice(0, 90)) + "…");
        if (!HOLD) timers.delivered = setTimeout(() => { if (LVStage.state === "delivered") LVStage.setState("idle"); }, 1200);
        break;
      }

      case "failed":
        freezeSession(now);
        if (trace.mode === "live") setTraceMode("fail", now); else { trace.frozenE = null; trace.mode = "fail"; trace.modeAt = now; }
        el["f-copy"].classList.remove("is-done");
        setFace("failed");
        show();
        break;
    }
    updateChips(next);
    updateMenubar(next);
    trace.drawOnce = true;
  }

  function onTheme(t) {
    build();
    theme = t;
    makeGradients();
    trace.drawOnce = true;
  }

  LVStage.init({
    name: "Lumen",
    states: [
      { id: "idle", label: "Idle" }, { id: "listening", label: "Listening" }, { id: "transcribing", label: "Transcribing" },
      { id: "delivered", label: "Delivered" }, { id: "failed", label: "Failed → Copy" }, { id: "history", label: "History" },
    ],
    defaultState: "listening",
    sequence: [["listening", 4200], ["transcribing", 1100], ["delivered", 1300], ["idle", 0]],
    onState, onTheme,
    onTick(level) { trace.level = level; },
  });
})();
</script>
</body>
</html>
