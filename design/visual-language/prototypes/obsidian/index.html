<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Voice · Obsidian</title>
<link rel="stylesheet" href="../shared/stage.css">
<style>
/* =====================================================================================
   OBSIDIAN
   The overlay is a precision instrument milled from one block of black glass.
   Depth comes from light on edges, never from gradients on faces.
   Every effect carries a "native:" note saying how SwiftUI/AppKit reproduces it.
   ===================================================================================== */

:root {
  --ob-font: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;

  /* ---- surfaces ---- */
  --ob-face: #070709;                      /* pill face. Not #000, so edges can read */
  --ob-card: #131317;                      /* history card: one step lighter */
  --ob-key: #0b0b0e;                       /* keycap face */
  --ob-menu: rgba(18, 18, 22, 0.96);

  /* ---- edge light ---- */
  --ob-edge-top: rgba(255, 255, 255, 0.16);   /* 1 px inner top highlight, fading out */
  --ob-edge-out: rgba(255, 255, 255, 0.09);   /* hairline outer edge */
  --ob-key-top: rgba(255, 255, 255, 0.15);
  --ob-key-top-hi: rgba(255, 255, 255, 0.30);
  --ob-key-top-lo: rgba(255, 255, 255, 0.05);
  --ob-key-shade: rgba(0, 0, 0, 0.70);
  --ob-key-out: rgba(255, 255, 255, 0.10);
  --ob-key-out-hi: rgba(255, 255, 255, 0.20);

  /* ---- shadows ---- */
  --ob-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.60);
  --ob-card-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.60);
  --ob-key-drop: 0 1px 1.5px rgba(0, 0, 0, 0.70), 0 3px 7px rgba(0, 0, 0, 0.32);
  --ob-key-drop-press: 0 0.5px 0.5px rgba(0, 0, 0, 0.70);

  /* ---- ink ---- */
  --ob-ink: rgba(255, 255, 255, 0.92);
  --ob-ink-2: rgba(255, 255, 255, 0.85);
  --ob-meta: rgba(255, 255, 255, 0.55);
  --ob-glyph: rgba(236, 240, 248, 0.78);   /* cool white */
  --ob-glyph-off: rgba(236, 240, 248, 0.28);
  --ob-hair: rgba(255, 255, 255, 0.08);

  /* ---- signal ---- */
  --ob-bloom: rgba(233, 237, 244, 0.35);
  --ob-ok-bloom: rgba(159, 227, 178, 0.30);
  --ob-amber: #ffb65c;
  --ob-ok: #9fe3b2;

  /* ---- motion ---- */
  --ob-t-enter: 90ms;
  --ob-t-dismiss: 140ms;
  --ob-t-press: 80ms;
  --ob-t-swap: 100ms;
  --ob-t-grow: 120ms;
  --ob-ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ob-ease-in: cubic-bezier(0.4, 0, 1, 1);
}

/* Light appearance: the instrument responds to the room. Still a dark instrument, now polished
   graphite, with a stronger top edge light and softer shadows for a bright desk. */
:root[data-appearance="light"] {
  --ob-face: #1e2024;
  --ob-card: #26282d;
  --ob-key: #2a2c31;
  --ob-menu: rgba(30, 32, 36, 0.97);
  --ob-edge-top: rgba(255, 255, 255, 0.28);
  --ob-edge-out: rgba(0, 0, 0, 0.30);        /* on a light desk the outer hairline turns dark */
  --ob-key-top: rgba(255, 255, 255, 0.22);
  --ob-key-top-hi: rgba(255, 255, 255, 0.42);
  --ob-key-top-lo: rgba(255, 255, 255, 0.08);
  --ob-key-shade: rgba(0, 0, 0, 0.40);
  --ob-key-out: rgba(0, 0, 0, 0.34);
  --ob-key-out-hi: rgba(0, 0, 0, 0.45);
  --ob-shadow: 0 8px 24px rgba(0, 0, 0, 0.30), 0 1px 2px rgba(0, 0, 0, 0.35);
  --ob-card-shadow: 0 12px 32px rgba(0, 0, 0, 0.30), 0 1px 2px rgba(0, 0, 0, 0.35);
  --ob-key-drop: 0 1px 1.5px rgba(0, 0, 0, 0.40), 0 3px 7px rgba(0, 0, 0, 0.16);
  --ob-key-drop-press: 0 0.5px 0.5px rgba(0, 0, 0, 0.40);
  --ob-glyph: rgba(240, 243, 250, 0.82);
  --ob-glyph-off: rgba(240, 243, 250, 0.30);
  --ob-hair: rgba(255, 255, 255, 0.09);
  --ob-bloom: rgba(233, 237, 244, 0.46);
  --ob-ok-bloom: rgba(159, 227, 178, 0.38);
}

/* =====================================================================================
   Overlay root. makeDraggable() owns .ob-root's transform, so entrance and dismiss
   animate the inner .ob-anim.
   ===================================================================================== */
.ob-root {
  margin-bottom: 50px;                     /* native: overlayBottomOffset 50 */
  font-family: var(--ob-font);
  color: var(--ob-ink);
  -webkit-user-select: none; user-select: none;
  cursor: default;
  font-variant-numeric: tabular-nums;
}
.ob-root[hidden] { display: none; }
.ob-anim {
  transform-origin: 50% 100%;
  transition: opacity var(--ob-t-enter) linear;
}
/* native: panel alpha 0 -> 1 over 90 ms, first frame composed offscreen (as today). */
.ob-anim.is-entering { opacity: 0; transition: none; }
/* native: scaleEffect(0.985) + offset(y: 6) + opacity 0, .timingCurve(0.4,0,1,1, 0.14). */
.ob-anim.is-dismissing {
  opacity: 0; transform: translateY(6px) scale(0.985);
  transition: opacity var(--ob-t-dismiss) var(--ob-ease-in), transform var(--ob-t-dismiss) var(--ob-ease-in);
}
.ob-row { position: relative; display: flex; align-items: flex-end; gap: 6px; }

/* =====================================================================================
   Rails and keycaps
   ===================================================================================== */
/* Rails are exactly as tall as the base pill and bottom-aligned, so the failed card can grow the
   pill upward without moving a single key. native: VStack { key; Spacer(); key }.frame(height: 128) */
.ob-rail { width: 32px; height: 128px; display: flex; flex-direction: column; justify-content: space-between; }

/* Machined keycap. native: RoundedRectangle(9).fill(face)
     + overlay(top 1 px inner highlight: strokeBorder masked to the top edge, or an inset Rectangle)
     + overlay(bottom 1 px inner shade) + strokeBorder(hairline 0.5) + two .shadow()s. */
.ob-key {
  position: relative; width: 32px; height: 26px; padding: 0; border: 0; border-radius: 9px;
  background: var(--ob-key); color: var(--ob-glyph);
  display: grid; place-items: center; cursor: default; outline: none;
  box-shadow:
    inset 0 1px 0 var(--ob-key-top),
    inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px var(--ob-key-out),
    var(--ob-key-drop);
  transition: box-shadow var(--ob-t-press) linear, transform var(--ob-t-press) linear, color var(--ob-t-press) linear;
}
.ob-key svg { width: 14px; height: 14px; display: block; }
.ob-key > .ob-g { grid-area: 1 / 1; display: grid; place-items: center; transition: opacity var(--ob-t-press) linear; }
.ob-key:hover:not(:disabled), .ob-key.is-hover {
  color: #fff;
  box-shadow:
    inset 0 1px 0 var(--ob-key-top-hi),
    inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px var(--ob-key-out-hi),
    var(--ob-key-drop);
}
/* Pressed: the keycap sinks 1 px, its top light dims, its shadow shortens. native: ButtonStyle with
   configuration.isPressed -> offset(y: 1), highlight opacity 0.05, shadow radius 0.5. */
.ob-key:active:not(:disabled), .ob-key.is-pressed {
  transform: translateY(1px);
  color: #fff;
  box-shadow:
    inset 0 1px 0 var(--ob-key-top-lo),
    inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px var(--ob-key-out),
    var(--ob-key-drop-press);
}
/* Latched (History while its card is open): lit, not sunk, so the key never moves. native: same
   style with a brighter top highlight and full-white glyph while the card panel is visible. */
.ob-key.is-on:not(:active) {
  color: #fff;
  box-shadow:
    inset 0 1px 0 var(--ob-key-top-hi),
    inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px var(--ob-key-out-hi),
    0 0 8px rgba(233, 237, 244, 0.10),
    var(--ob-key-drop);
}
.ob-key:disabled { color: var(--ob-glyph-off); box-shadow: inset 0 1px 0 var(--ob-key-top-lo), 0 0 0 0.5px var(--ob-key-out), var(--ob-key-drop); }
.ob-key:focus-visible { box-shadow: 0 0 0 2px rgba(233, 237, 244, 0.5), var(--ob-key-drop); }
/* Copy feedback: glyph swaps to a check for 900 ms in green-white. Size never changes. */
.ob-key .ob-g-ok { opacity: 0; color: var(--ob-ok); }
.ob-key.is-copied .ob-g-main { opacity: 0; }
.ob-key.is-copied .ob-g-ok { opacity: 1; }

/* =====================================================================================
   The pill
   ===================================================================================== */
.ob-pill {
  position: relative; width: 340px; height: 128px; border-radius: 18px;
  background: var(--ob-face);
  /* native: .shadow(black 0.55, r 15, y 10) + .shadow(black 0.6, r 1, y 1); hairline = strokeBorder 0.5 */
  box-shadow: 0 0 0 0.5px var(--ob-edge-out), var(--ob-shadow);
  transition: height var(--ob-t-grow) var(--ob-ease-out);
}
/* Edge light: a 1 px inner stroke, white 0.16 at the top fading to 0 by 52 px (~40% of the base height).
   native: RoundedRectangle(18).strokeBorder(LinearGradient([.white.opacity(0.16), .clear],
           startPoint: .top, endPoint: UnitPoint(x: 0.5, y: 52/height)), lineWidth: 1) */
.ob-pill::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(180deg, var(--ob-edge-top) 0px, rgba(255, 255, 255, 0) 52px);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* Grain: a static monochrome noise image at 3.5%. native: a tiling opaque grey-noise PNG in a CALayer
   (or Image(...).resizable(resizingMode: .tile)) at opacity 0.035, clipped to the pill shape. */
.ob-pill::after, .ob-card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0.035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/></filter><rect width='128' height='128' filter='url(%23n)'/></svg>");
  background-size: 128px 128px;
}
:root[data-appearance="light"] .ob-pill::after, :root[data-appearance="light"] .ob-card::after { opacity: 0.045; }

/* ---- live preview: bottom-anchored, head-truncated (newest words stay on the line nearest the trace).
   native: Text(tail).lineLimit(3).truncationMode(.head) in a frame(height: 54, alignment: .bottomLeading) */
.ob-preview {
  position: absolute; left: 18px; right: 18px; top: 12px; height: 54px;
  display: flex; flex-direction: column; justify-content: flex-end;
  font: 500 13.5px/18px var(--ob-font); color: var(--ob-ink);
  overflow: hidden;
}
.ob-live { transition: color var(--ob-t-swap) linear; }
.ob-measure {
  position: absolute; left: 18px; width: 304px; top: 0; visibility: hidden; pointer-events: none;
  font: 500 13.5px/18px var(--ob-font);
}
/* Before the first words arrive, the display reads out the input: catches an AirPods hijack at a glance. */
.ob-readout {
  display: inline-flex; align-items: center; gap: 6px; height: 18px;
  font: 500 11.5px/18px var(--ob-font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ob-meta);
}
.ob-readout svg { width: 12px; height: 12px; }

/* ---- trace row ---- */
.ob-trace { position: absolute; left: 0; right: 0; bottom: 12px; height: 44px; }
/* Target app icon: a state indicator, not a button. Centred on the trace midline, leading inset 11. */
.ob-app { position: absolute; left: 11px; top: 12px; width: 20px; height: 20px; display: block; }
.ob-app svg { display: block; }
.ob-bars, .ob-glow { position: absolute; left: 40px; top: 0; width: 260px; height: 44px; display: block; pointer-events: none; }
/* Phosphor bloom. native: the bars' container .compositingGroup().shadow(color: trace.opacity(0.35), radius: 5) */
.ob-bars { filter: drop-shadow(0 0 5px var(--ob-bloom)); }
/* Afterglow: a blurred copy of the trace's persistence envelope behind it.
   native: a second bar layer (same geometry, decaying peak-hold heights) with .blur(radius: 7), opacity 0.25 */
.ob-glow { filter: blur(7px); opacity: 0.25; }
:root[data-appearance="light"] .ob-glow { opacity: 0.30; }
.ob-root[data-s="delivered"] .ob-bars { filter: drop-shadow(0 0 5px var(--ob-ok-bloom)); }
/* Elapsed counter: mirrors the app icon on the right end of the trace row. */
.ob-timer {
  position: absolute; left: 300px; width: 38px; top: 0; height: 44px;
  font: 500 11.5px/44px var(--ob-font); letter-spacing: 0.02em; text-align: center;
  font-variant-numeric: tabular-nums; color: var(--ob-meta);
}

/* ---- delivered: one line, centred in the preview area; the counter hands its time to the line ---- */
.ob-done {
  position: absolute; left: 18px; right: 18px; top: 12px; height: 54px;
  display: none; align-items: center; gap: 0;
  font: 500 13.5px/18px var(--ob-font); color: var(--ob-ink); white-space: nowrap;
}
.ob-done .ob-ok-g { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ob-ok); margin-right: 6px;
  filter: drop-shadow(0 0 4px rgba(159, 227, 178, 0.45)); }
.ob-done .ob-ok-g svg { width: 14px; height: 14px; }
.ob-done b { font-weight: 600; color: #fff; }
.ob-done .ob-dim { color: var(--ob-meta); }
.ob-sep-dot { padding: 0 6px; color: var(--ob-meta); }

/* ---- failed: the pill grows upward 21 px; keys and trace baseline never move ---- */
.ob-fail { position: absolute; left: 18px; right: 18px; top: 12px; height: 75px; display: none; }
.ob-fail-h { display: flex; align-items: center; gap: 9px; height: 18px; font: 600 13.5px/18px var(--ob-font); color: #fff; }
/* Amber status LED. native: Circle().fill(amber).frame(7).shadow(color: amber.opacity(0.55), radius: 3) */
.ob-led { width: 7px; height: 7px; border-radius: 50%; background: var(--ob-amber); box-shadow: 0 0 6px rgba(255, 182, 92, 0.55), inset 0 -1px 1px rgba(0, 0, 0, 0.25); flex: none; }
.ob-fail-t {
  margin-top: 6px; font: 400 13px/17px var(--ob-font); color: var(--ob-ink-2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.ob-actions { position: absolute; left: 18px; right: 18px; bottom: 12px; height: 44px; display: none; align-items: center; gap: 6px; }
/* Copy: a wide keycap with an amber edge. Label swaps to check + "Copied" inside a fixed 88 px width. */
.ob-copybtn {
  position: relative; width: 88px; height: 28px; padding: 0; border: 0; border-radius: 9px; flex: none;
  background: var(--ob-key); color: #fff; cursor: default; outline: none;
  display: grid; place-items: center;
  font: 600 13px/1 var(--ob-font);
  box-shadow:
    inset 0 1px 0 rgba(255, 220, 170, 0.22),
    inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px rgba(255, 182, 92, 0.62),
    0 0 10px rgba(255, 182, 92, 0.10),
    var(--ob-key-drop);
  transition: box-shadow var(--ob-t-press) linear, transform var(--ob-t-press) linear;
}
.ob-copybtn > span { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 6px; transition: opacity var(--ob-t-press) linear; }
.ob-copybtn svg { width: 13px; height: 13px; }
.ob-copybtn .ob-cb-ok { opacity: 0; color: var(--ob-ok); }
.ob-copybtn:hover, .ob-copybtn.is-hover {
  box-shadow: inset 0 1px 0 rgba(255, 220, 170, 0.36), inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px rgba(255, 182, 92, 0.95), 0 0 12px rgba(255, 182, 92, 0.18), var(--ob-key-drop);
}
.ob-copybtn:active, .ob-copybtn.is-pressed {
  transform: translateY(1px);
  box-shadow: inset 0 1px 0 rgba(255, 220, 170, 0.08), inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px rgba(255, 182, 92, 0.62), var(--ob-key-drop-press);
}
.ob-copybtn.is-copied {
  box-shadow: inset 0 1px 0 rgba(200, 255, 215, 0.20), inset 0 -1px 0 var(--ob-key-shade),
    0 0 0 0.5px rgba(159, 227, 178, 0.65), 0 0 10px rgba(159, 227, 178, 0.10), var(--ob-key-drop);
}
.ob-copybtn.is-copied .ob-cb-main { opacity: 0; }
.ob-copybtn.is-copied .ob-cb-ok { opacity: 1; }
.ob-textbtn {
  height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: default; outline: none;
  font: 500 13px/28px var(--ob-font); color: rgba(255, 255, 255, 0.62);
  transition: color var(--ob-t-press) linear, background-color var(--ob-t-press) linear;
}
.ob-textbtn:hover { color: rgba(255, 255, 255, 0.95); background: rgba(255, 255, 255, 0.05); }
.ob-textbtn:active { color: rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.03); }
.ob-actmeta { margin-left: auto; font: 500 11.5px/1 var(--ob-font); letter-spacing: 0.02em; color: var(--ob-meta); font-variant-numeric: tabular-nums; }

/* ---- state switching (content swaps inside reserved slots; only the failed pill grows, upward) ---- */
.ob-root[data-s="failed"] .ob-pill { height: 149px; }
.ob-root[data-s="delivered"] .ob-preview { display: none; }
.ob-root[data-s="delivered"] .ob-done { display: flex; animation: ob-in var(--ob-t-swap) linear; }
.ob-root[data-s="failed"] .ob-preview, .ob-root[data-s="failed"] .ob-trace { display: none; }
.ob-root[data-s="failed"] .ob-fail { display: block; animation: ob-in var(--ob-t-swap) linear; }
.ob-root[data-s="failed"] .ob-actions { display: flex; animation: ob-in var(--ob-t-swap) linear; }
.ob-root[data-s="transcribing"] .ob-live { color: rgba(255, 255, 255, 0.62); }
.ob-root[data-s="delivered"] .ob-timer { visibility: hidden; }
.ob-root.ob-instant .ob-pill { transition: none; }
@keyframes ob-in { from { opacity: 0; } }

/* =====================================================================================
   History card: a second slab, a step lighter, anchored to the History key's leading edge.
   native: child NSPanel .above the overlay; origin = key.minX, key.maxY + 6.
   ===================================================================================== */
.ob-card {
  position: absolute; left: 0; bottom: 134px;  /* 128 (rail) + 6 gap */
  width: 480px; max-height: 440px; display: flex; flex-direction: column;   /* contract: up to 480; 440 leaves a row cut under the fade */
  border-radius: 14px; background: var(--ob-card);
  box-shadow: 0 0 0 0.5px var(--ob-edge-out), var(--ob-card-shadow);
  cursor: default; z-index: 2;
  animation: ob-in var(--ob-t-swap) linear;
}
.ob-card[hidden] { display: none; }
.ob-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(180deg, var(--ob-edge-top) 0px, rgba(255, 255, 255, 0) 64px);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.ob-card-h {
  flex: none; height: 36px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--ob-hair);
  font: 600 11px/1 var(--ob-font); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ob-meta);
}
.ob-card-h span:last-child { font-weight: 500; letter-spacing: 0.02em; text-transform: none; font-size: 11.5px; }
.ob-list {
  position: relative; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px;
  overscroll-behavior: contain;
}
.ob-list.has-more { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent); }
.ob-list::-webkit-scrollbar { width: 10px; }
.ob-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
.ob-hrow {
  position: relative; display: block; width: 100%; text-align: left; border: 0; margin: 0; cursor: default; outline: none;
  padding: 10px 12px 10px; border-radius: 9px; background: transparent; color: inherit; font: inherit;
  transition: background-color var(--ob-t-press) linear, box-shadow var(--ob-t-press) linear;
}
/* hairline dividers sit in the 1 px gap between rows; they hide next to a lifted row */
.ob-hrow + .ob-hrow::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 1px; background: var(--ob-hair); }
.ob-hrow:hover::before, .ob-hrow:hover + .ob-hrow::before, .ob-hrow.is-hover::before, .ob-hrow.is-hover + .ob-hrow::before { opacity: 0; }
/* Hover: the row lifts (a white 0.06 plate with edge light on its top). */
.ob-hrow:hover, .ob-hrow.is-hover { background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.11), 0 0 0 0.5px rgba(255, 255, 255, 0.05); }
.ob-hrow:active { background: rgba(255, 255, 255, 0.035); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04); }
.ob-ht {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  font: 400 13px/18px var(--ob-font); color: rgba(255, 255, 255, 0.90);
}
.ob-hm {
  margin-top: 6px; display: flex; align-items: center; gap: 0; white-space: nowrap;
  font: 500 11.5px/14px var(--ob-font); letter-spacing: 0.02em; color: var(--ob-meta); font-variant-numeric: tabular-nums;
}
.ob-hm .ob-sep-dot { padding: 0 5px; }
.ob-hm .ob-mini { display: inline-block; width: 13px; height: 13px; margin-right: 5px; }
.ob-hm .ob-mini svg { width: 13px; height: 13px; display: block; }
.ob-hm .ob-warn { color: var(--ob-amber); display: inline-flex; align-items: center; gap: 5px; }
.ob-hm .ob-warn i { width: 5px; height: 5px; border-radius: 50%; background: var(--ob-amber); box-shadow: 0 0 4px rgba(255, 182, 92, 0.6); }

/* =====================================================================================
   Menu bar item and menu
   ===================================================================================== */
.ob-status svg { display: block; }
.ob-mark { transition: opacity 160ms linear; }
.ob-status[data-s="transcribing"] .ob-mark { opacity: 0.45; }
/* The NSMenu. Forced dark appearance (menu.appearance = .darkAqua), Graphite-accent highlight. */
.ob-menu {
  position: fixed; z-index: 130; width: 300px; padding: 5px;
  border-radius: 10px; background: var(--ob-menu);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 0 0 0.5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.07), 0 14px 36px rgba(0, 0, 0, 0.45);
  font: 400 13px/1 var(--ob-font); color: rgba(255, 255, 255, 0.92);
  font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; cursor: default;
}
.ob-menu[hidden] { display: none; }
.ob-mi { position: relative; height: 22px; padding: 0 9px 0 22px; border-radius: 5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ob-mi > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ob-mi kbd { font: 400 13px/1 var(--ob-font); color: rgba(255, 255, 255, 0.50); letter-spacing: 0.02em; }
.ob-mi em { font-style: normal; color: rgba(255, 255, 255, 0.55); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.ob-mi .ob-chev { width: 10px; height: 10px; color: rgba(255, 255, 255, 0.6); flex: none; }
.ob-mi .ob-tick { position: absolute; left: 6px; top: 5px; width: 12px; height: 12px; color: rgba(255, 255, 255, 0.92); }
.ob-mi:hover, .ob-mi.is-hi { background: rgba(255, 255, 255, 0.14); }
.ob-mi:hover kbd, .ob-mi:hover em, .ob-mi.is-hi em { color: rgba(255, 255, 255, 0.72); }
.ob-msep { height: 1px; margin: 5px 10px; background: rgba(255, 255, 255, 0.10); }
.ob-mhead { height: 22px; padding: 0 9px 0 22px; display: flex; align-items: center; color: rgba(255, 255, 255, 0.45); font-size: 12px; font-weight: 600; }
.ob-sub { position: absolute; right: calc(100% - 3px); top: 22px; width: 250px; padding: 5px; border-radius: 10px; background: var(--ob-menu);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 0 0 0.5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.07), 0 14px 36px rgba(0, 0, 0, 0.45); }
.ob-sub[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .ob-anim.is-dismissing { transform: none; }
}
</style>
</head>
<body>
<script src="../shared/mock-data.js"></script>
<script src="../shared/stage.js"></script>
<script>
(() => {
  "use strict";
  const M = window.LV_MOCK;
  const Q = new URLSearchParams(location.search);
  const HOLD = Q.get("hold") === "1";          // screenshots: keep "delivered" on screen
  const RM = window.matchMedia("(prefers-reduced-motion: reduce)");
  const now = () => performance.now();
  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  // ---------- geometry: medium size, from notes/overlay-anatomy.md §2 and §5 ----------
  const G = { bars: 65, bw: 2, pitch: 4, minH: 2, maxH: 40, w: 260, h: 44,
              sampleMs: 85,   // one sample per 4096-frame buffer at 48 kHz, as the native tap delivers
              easeMs: 60, flatMs: 180, sweepMs: 1050, gate: 0.4 };
  const MOTION = { dismiss: 140, delivered: 1200, copied: 900, copiedCard: 1800, reprocess: 1100 };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (sec) => { const s = Math.max(0, Math.floor(sec)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

  // ---------- glyphs: 1.5 px stroke stand-ins for SF Symbols (native uses the real symbol, 12 pt semibold) ----------
  const SW = 'viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const GL = {
    // SF Symbol: clock.arrow.circlepath
    history: `<svg ${SW}><path d="M3.9 10.9A5.2 5.2 0 1 0 3.1 7.8"/><path d="M1.6 6.6 3.1 8.4 4.7 6.7"/><path d="M8.3 5.3v3.2l2.1 1.3"/></svg>`,
    // SF Symbol: doc.on.doc
    copy: `<svg ${SW}><path d="M5.6 5.2V3.7c0-.9.7-1.6 1.6-1.6h4.6c.9 0 1.6.7 1.6 1.6v5.9c0 .9-.7 1.6-1.6 1.6h-1.3"/><rect x="2.6" y="5.2" width="7.9" height="8.7" rx="1.6"/></svg>`,
    // SF Symbol: xmark
    cancel: `<svg ${SW}><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2"/></svg>`,
    // SF Symbol: arrow.clockwise
    reprocess: `<svg ${SW}><path d="M12.1 5.4A5.1 5.1 0 1 1 8 3.4"/><path d="M6.6 1.5 8.6 3.4 6.7 5.3"/></svg>`,
    // SF Symbol: checkmark
    check: `<svg ${SW}><path d="M3.4 8.7l3.1 3 6.1-7"/></svg>`,
    // SF Symbol: mic
    mic: `<svg ${SW}><rect x="5.8" y="1.8" width="4.4" height="7.6" rx="2.2"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.3v2"/></svg>`,
    // SF Symbol: chevron.right
    chev: `<svg class="ob-chev" ${SW}><path d="M6 3.5 10.5 8 6 12.5"/></svg>`,
  };

  // ---------- target-app icons (stand-ins for the real NSImage the app reads from NSWorkspace) ----------
  let uid = 0;
  function appIcon(app, size) {
    const id = "obi" + (++uid), s = size || 20;
    const frame = (inner, stroke) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" aria-hidden="true"><defs><clipPath id="${id}"><rect x="0.5" y="0.5" width="19" height="19" rx="4.6"/></clipPath></defs><g clip-path="url(#${id})">${inner}</g><rect x="0.5" y="0.5" width="19" height="19" rx="4.6" fill="none" stroke="${stroke || "rgba(255,255,255,0.22)"}" stroke-width="0.6"/></svg>`;
    switch (app) {
      case "Mail": return frame(`<rect width="20" height="20" fill="#2f8cf5"/><rect width="20" height="9" fill="#55a6ff"/><rect x="4" y="6" width="12" height="8.4" rx="1.3" fill="#fff"/><path d="M4.5 6.6 10 10.7l5.5-4.1" fill="none" stroke="#2f8cf5" stroke-width="1.1"/>`);
      case "Notes": return frame(`<rect width="20" height="20" fill="#fdfbf3"/><rect width="20" height="5.6" fill="#f6c945"/><path d="M4 9.4h12M4 12.4h12M4 15.4h7.5" stroke="#d8d2c0" stroke-width="0.9"/>`, "rgba(0,0,0,0.18)");
      case "Slack": return frame(`<rect width="20" height="20" fill="#4a154b"/><path d="M8 4.8 6.9 15.2M13.2 4.8l-1.1 10.4M4.8 8.1h10.6M4.4 11.9H15" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>`);
      case "Safari": return frame(`<rect width="20" height="20" fill="#e9eef5"/><circle cx="10" cy="10" r="7.2" fill="#2a8af6"/><path d="M13.3 6.7 9.1 9.1 6.7 13.3 10.9 10.9z" fill="#fff"/><path d="M13.3 6.7 9.1 9.1 10.9 10.9z" fill="#ff5a4e"/>`, "rgba(0,0,0,0.15)");
      default: // c11
        return frame(`<rect width="20" height="20" fill="#141824"/><rect width="20" height="7" fill="#1b2130"/><path d="M5.4 6.6 8.6 10l-3.2 3.4" fill="none" stroke="#8fb3ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 13.4h4.2" stroke="#e9edf4" stroke-width="1.7" stroke-linecap="round"/>`);
    }
  }

  // ---------- mock data ----------
  const LAST = M.history[0];                                         // delivered: c11, 118 words, 0:41
  const FAILED = M.history.find((h) => !h.delivered) || M.history[0]; // couldn't paste: c11, 189 words, 1:06
  const WORDS = M.livePreview.join(" ").split(/\s+/);
  let mic = M.mics[0].name;

  // ======================================================================================
  // DOM
  // ======================================================================================
  // The stage builds its desktop inside init(), so the overlay is built on the first stage callback.
  function boot() {
  const host = LVStage.host();
  const root = document.createElement("div");
  root.className = "ob-root";
  root.hidden = true;
  root.innerHTML = `
    <div class="ob-anim">
      <div class="ob-row">
        <div class="ob-rail">
          <button class="ob-key" data-act="history" title="Recent Dictations" aria-label="Recent Dictations">${GL.history}</button>
          <button class="ob-key" data-act="copy" title="Copy Last Transcription" aria-label="Copy Last Transcription"><span class="ob-g ob-g-main">${GL.copy}</span><span class="ob-g ob-g-ok">${GL.check}</span></button>
        </div>
        <div class="ob-pill">
          <div class="ob-preview"><div class="ob-live"></div></div>
          <div class="ob-done">
            <span class="ob-ok-g">${GL.check}</span><span>Delivered to&nbsp;<b>${esc(LAST.target)}</b></span><span class="ob-sep-dot">·</span><span class="ob-dim">${LAST.words} words</span><span class="ob-sep-dot">·</span><span class="ob-dim">${fmt(LAST.seconds)}</span>
          </div>
          <div class="ob-fail">
            <div class="ob-fail-h"><span class="ob-led"></span><span>Couldn’t paste into ${esc(FAILED.target)}</span></div>
            <div class="ob-fail-t">${esc(FAILED.text)}</div>
          </div>
          <div class="ob-trace">
            <span class="ob-app" title="Dictation target app">${appIcon("c11", 20)}</span>
            <canvas class="ob-glow"></canvas>
            <canvas class="ob-bars"></canvas>
            <span class="ob-timer">0:00</span>
          </div>
          <div class="ob-actions">
            <button class="ob-copybtn" data-act="copy-card" title="Copy to the clipboard"><span class="ob-cb-main">${GL.copy}<span>Copy</span></span><span class="ob-cb-ok">${GL.check}<span>Copied</span></span></button>
            <button class="ob-textbtn" data-act="dismiss">Dismiss</button>
            <span class="ob-actmeta">${FAILED.words} words · ${fmt(FAILED.seconds)}</span>
          </div>
          <div class="ob-measure" aria-hidden="true"></div>
        </div>
        <div class="ob-rail">
          <button class="ob-key" data-act="cancel" title="Cancel Dictation" aria-label="Cancel Dictation">${GL.cancel}</button>
          <button class="ob-key" data-act="reprocess" title="Reprocess Last Dictation" aria-label="Reprocess Last Dictation">${GL.reprocess}</button>
        </div>
        <div class="ob-card" data-nodrag hidden role="dialog" aria-label="Recent dictations">
          <div class="ob-card-h"><span>Recent dictations</span><span>Click to insert</span></div>
          <div class="ob-list"></div>
        </div>
      </div>
    </div>`;
  host.appendChild(root);
  LVStage.makeDraggable(root, "obsidian");

  const $ = (s) => root.querySelector(s);
  const anim = $(".ob-anim"), live = $(".ob-live"), meas = $(".ob-measure"), timerEl = $(".ob-timer");
  const card = $(".ob-card"), list = $(".ob-list");
  const keyHistory = $('[data-act="history"]'), keyCopy = $('[data-act="copy"]'), keyReprocess = $('[data-act="reprocess"]');
  const copyBtn = $(".ob-copybtn");
  const cvBars = $(".ob-bars"), cvGlow = $(".ob-glow");

  // ======================================================================================
  // Trace engine
  // Two FIFOs of 65 slots (bars and afterglow). Each sample shifts every slot left, and each slot
  // morphs from its current height to its new one over 60 ms linear.
  // native: ForEach keyed by slot index + withAnimation(.linear(duration: 0.06)), exactly as today.
  // ======================================================================================
  const T = {
    from: new Float32Array(G.bars).fill(G.minH), to: new Float32Array(G.bars).fill(G.minH),
    gFrom: new Float32Array(G.bars).fill(G.minH), gTo: new Float32Array(G.bars).fill(G.minH),
    t0: 0, dur: G.easeMs, out: false, n: 0, peak: 0, lastAt: 0,
    mode: "off",       // live | sweep | done | off
    sweepT0: 0,
  };
  function progress(t) {
    if (RM.matches) return 1;
    const k = clamp01((t - T.t0) / T.dur);
    return T.out ? 1 - Math.pow(1 - k, 3) : k;
  }
  function snapshot(t) {
    const k = progress(t);
    for (let i = 0; i < G.bars; i++) {
      T.from[i] += (T.to[i] - T.from[i]) * k;
      T.gFrom[i] += (T.gTo[i] - T.gFrom[i]) * k;
    }
    T.t0 = t;
  }
  // Signal path from the contract: noise gate 0.4, level^1.15, grain multiplier per sample index.
  function heightFor(level, n) {
    const adjusted = clamp01((level - G.gate) / (1 - G.gate));
    const amplified = Math.pow(adjusted, 1.15);
    const grain = 0.6 + 0.25 * Math.cos(1.7 * n) + 0.15 * Math.cos(4.3 * n);
    return Math.min(G.maxH, Math.max(G.minH, G.minH + (G.maxH - G.minH) * amplified * grain));
  }
  function pushSample(level, t, animate) {
    if (animate) snapshot(t);
    const h = heightFor(level, T.n);
    T.n = (T.n + 1) % 1024;
    T.to.copyWithin(0, 1); T.to[G.bars - 1] = h;
    // Afterglow = phosphor persistence: a peak-hold that decays sample to sample.
    const g = Math.max(h, T.gTo[G.bars - 1] * 0.84);
    T.gTo.copyWithin(0, 1); T.gTo[G.bars - 1] = g;
    T.dur = G.easeMs; T.out = false;
    if (!animate) { T.from.set(T.to); T.gFrom.set(T.gTo); }
  }
  function resetTrace() { T.from.fill(G.minH); T.to.fill(G.minH); T.gFrom.fill(G.minH); T.gTo.fill(G.minH); T.n = 0; }
  function flatten(t) {
    snapshot(t);
    T.to.fill(G.minH); T.gTo.fill(G.minH);
    T.dur = G.flatMs; T.out = true;       // native: easeOut(0.18) to min height, as today
  }

  let dpr = 0;
  function sizeCanvases() {
    const d = window.devicePixelRatio || 1;
    if (d === dpr) return;
    dpr = d;
    for (const c of [cvBars, cvGlow]) { c.width = Math.round(G.w * d); c.height = Math.round(G.h * d); }
  }
  function capsule(ctx, x, y, w, h) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(w, h) / 2); ctx.fill(); }
    else ctx.fillRect(x, y, w, h);
  }
  const RGB = { trace: [233, 237, 244], hot: [250, 251, 255], ok: [159, 227, 178], glow: [176, 198, 236] };
  function draw(t) {
    sizeCanvases();
    const cx = cvBars.getContext("2d"), gx = cvGlow.getContext("2d");
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); gx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, G.w, G.h); gx.clearRect(0, 0, G.w, G.h);
    if (T.mode === "off") return;
    const k = progress(t);
    const x0 = (G.w - ((G.bars - 1) * G.pitch + G.bw)) / 2;
    let sweepC = 0, pulse = 0;
    if (T.mode === "sweep") {
      const p = ((t - T.sweepT0) % G.sweepMs) / G.sweepMs;
      sweepC = -0.15 + 1.3 * p;                                        // native: CAGradientLayer locations
      pulse = 0.5 - 0.5 * Math.cos(((t - T.sweepT0) / 1600) * 2 * Math.PI);  // reduced motion: a crossfade
    }
    for (let i = 0; i < G.bars; i++) {
      const u = i / (G.bars - 1);
      const h = T.from[i] + (T.to[i] - T.from[i]) * k;
      const gh = T.gFrom[i] + (T.gTo[i] - T.gFrom[i]) * k;
      const x = x0 + i * G.pitch;
      let a, c = RGB.trace, ga;
      if (T.mode === "live") {
        a = 0.35 + 0.65 * Math.pow(u, 1.4);                            // age fade from the contract
        const hot = clamp01((u - 0.84) / 0.16);                        // newest bars run hottest
        c = [0, 1, 2].map((j) => Math.round(RGB.trace[j] + (RGB.hot[j] - RGB.trace[j]) * hot));
        ga = a;
      } else if (T.mode === "sweep") {
        const base = 0.30;
        if (RM.matches) a = base + 0.30 * pulse;
        else {
          const d = Math.abs(u - sweepC) / 0.3;
          const s = d < 1 ? 0.5 + 0.5 * Math.cos(Math.PI * d) : 0;
          a = base + (0.95 - base) * s;
        }
        ga = (a - base) * 1.4;
      } else { // done
        c = RGB.ok; a = 0.55; ga = 0.25;
      }
      cx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
      capsule(cx, x, (G.h - h) / 2, G.bw, h);
      if (ga > 0.01) {
        const gc = T.mode === "done" ? RGB.ok : RGB.glow;
        gx.fillStyle = `rgba(${gc[0]},${gc[1]},${gc[2]},${Math.min(1, ga).toFixed(3)})`;
        const gH = Math.max(gh, h) + 2;
        gx.fillRect(x - 0.75, (G.h - gH) / 2, G.bw + 1.5, gH);
      }
    }
  }

  // ======================================================================================
  // Recording session: level source, timer, live preview
  // ======================================================================================
  const rec = { active: false, t0: 0, frozen: null, envT0: 0 };
  let stageLevel = 0, curLevel = 0;
  const P = { count: 0, nextAt: 0, rnd: LV.seeded(11) };

  function levelAt(t) {
    // The stage ticks only in "listening". In "history" the listening state runs underneath,
    // so sample the stage's own speech envelope directly.
    if (LVStage.state === "listening") return stageLevel;
    return LVStage.envelope(((t - rec.envT0) / 1000) % 60);
  }
  function beginRecording(warm) {
    const t = now();
    rec.active = true; rec.frozen = null; rec.envT0 = t;
    // First load opens mid-dictation so the page reads at a glance; every later start is fresh.
    rec.t0 = warm ? t - 36600 : t;
    P.count = warm ? 24 : 0;
    P.nextAt = t + (warm ? 350 : 750);
    resetTrace();
    if (warm) for (let i = 0; i < G.bars; i++) {
      // same sampler as live: the peak level inside each 85 ms buffer window
      let pk = 0; const t0 = 24 + i * G.sampleMs / 1000;
      for (let f = 0; f < 5; f++) pk = Math.max(pk, LVStage.envelope(t0 + f / 60));
      pushSample(pk, t, false);
    }
    T.lastAt = t; T.peak = 0;
    renderLive();
    timerEl.textContent = fmt((t - rec.t0) / 1000);
  }
  function endRecording() {
    if (rec.active && rec.frozen == null) rec.frozen = (now() - rec.t0) / 1000;
    rec.active = false;
    if (rec.frozen == null) rec.frozen = LAST.seconds;       // entered directly: show the mock dictation
    timerEl.textContent = fmt(rec.frozen);
    if (!live.textContent.trim() || live.querySelector(".ob-readout")) { P.count = 30; renderLive(); }
  }

  function fits(s) { meas.textContent = s; return meas.offsetHeight <= 55; }
  // Head truncation: keep the newest words, cut from the front, lead with an ellipsis.
  function headTruncate(words) {
    const full = words.join(" ");
    if (fits(full)) return full;
    let lo = 1, hi = words.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (fits("…" + words.slice(mid).join(" "))) hi = mid; else lo = mid + 1; }
    return "…" + words.slice(lo).join(" ");
  }
  function renderLive() {
    if (P.count === 0) {
      live.innerHTML = `<span class="ob-readout">${GL.mic}${esc(mic)}</span>`;
      return;
    }
    const words = [];
    for (let i = Math.max(0, P.count - 48); i < P.count; i++) words.push(WORDS[i % WORDS.length]);
    live.textContent = headTruncate(words);
  }
  function tickPreview(t) {
    if (t < P.nextAt) return;
    P.count += 1 + Math.floor(P.rnd() * 3);      // streaming ASR emits one to three words at a time
    P.nextAt = t + 420 + P.rnd() * 520;
    renderLive();
  }

  // ======================================================================================
  // Main loop (runs only while the overlay is on screen)
  // native: TimelineView(.animation) for the sweep; the trace advances per audio buffer.
  // ======================================================================================
  let raf = 0, deliverAt = 0;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (T.mode === "live" && rec.active) {
      curLevel = levelAt(t);
      T.peak = Math.max(T.peak, curLevel);
      if (t - T.lastAt > 600) T.lastAt = t - G.sampleMs;     // after a stall, don't burst
      // Keep scrolling in silence: a sample lands every 85 ms whatever the level (tiny 2 px bars).
      while (t - T.lastAt >= G.sampleMs) { pushSample(T.peak, t, true); T.peak = 0; T.lastAt += G.sampleMs; }
      tickPreview(t);
      timerEl.textContent = fmt((t - rec.t0) / 1000);
    }
    // Delivered auto-dismiss on a performance.now() clock; skipped with ?hold=1 for screenshots.
    if (deliverAt && t >= deliverAt) { deliverAt = 0; if (LVStage.state === "delivered") LVStage.setState("idle"); }
    draw(t);
    tickMark(t);
  }
  function startLoop() { if (!raf) raf = requestAnimationFrame(loop); }
  function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  // ======================================================================================
  // Show / dismiss
  // ======================================================================================
  let hideTimer = 0;
  function show() {
    const entering = root.hidden || anim.classList.contains("is-dismissing");
    clearTimeout(hideTimer);
    root.hidden = false;
    anim.classList.remove("is-dismissing");
    if (entering) {
      root.classList.add("ob-instant");         // compose the first frame at its final size
      anim.classList.add("is-entering");
      void anim.offsetWidth;
      requestAnimationFrame(() => {
        anim.classList.remove("is-entering");
        requestAnimationFrame(() => root.classList.remove("ob-instant"));
      });
    }
    startLoop();
  }
  function dismiss() {
    if (root.hidden) return;
    anim.classList.add("is-dismissing");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (LVStage.state !== "idle") return;
      root.hidden = true;
      anim.classList.remove("is-dismissing");
      T.mode = "off"; rec.active = false;
      stopLoop(); draw(now());
    }, RM.matches ? 0 : MOTION.dismiss);
  }

  // ======================================================================================
  // History card
  // ======================================================================================
  function renderHistory() {
    list.innerHTML = M.history.slice(0, 12).map((h, i) => {
      const day = LV.fmtDay(h.when);
      const when = (day === "Today" ? "" : day + " ") + LV.fmtTime(h.when);
      const warn = h.delivered ? "" : `<span class="ob-sep-dot">·</span><span class="ob-warn"><i></i>Not pasted</span>`;
      return `<button class="ob-hrow" data-i="${i}" title="Insert this dictation into the focused app">
        <span class="ob-ht">${esc(h.text)}</span>
        <span class="ob-hm"><span>${when}</span><span class="ob-sep-dot">·</span><span>${fmt(h.seconds)}</span><span class="ob-sep-dot">·</span><span>${h.words} words</span><span class="ob-sep-dot">·</span><span class="ob-mini">${appIcon(h.target, 13)}</span><span>${esc(h.target)}</span>${warn}</span>
      </button>`;
    }).join("");
  }
  function updateFade() { list.classList.toggle("has-more", list.scrollTop + list.clientHeight < list.scrollHeight - 2); }
  list.addEventListener("scroll", updateFade, { passive: true });
  function openCard() { card.hidden = false; keyHistory.classList.add("is-on"); list.scrollTop = 0; updateFade(); }
  function closeCard() { card.hidden = true; keyHistory.classList.remove("is-on"); }
  function requestCloseCard() { if (LVStage.state === "history") LVStage.setState("listening"); else closeCard(); }
  list.addEventListener("click", (e) => {
    const row = e.target.closest(".ob-hrow"); if (!row) return;
    const h = M.history[+row.dataset.i];
    LVStage.insertText(esc(h.text.slice(0, 90)) + "…");
    requestCloseCard();
  });
  document.addEventListener("mousedown", (e) => {
    if (card.hidden) return;
    if (card.contains(e.target) || keyHistory.contains(e.target) || e.target.closest("#lv-controls")) return;
    requestCloseCard();
  }, true);

  // ======================================================================================
  // Keys and actions
  // ======================================================================================
  function copyText(text) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {}); } catch (_) {}
  }
  let copyTimer = 0, cardCopyTimer = 0, reprocessTimer = 0;
  function flashKeyCopied() {
    keyCopy.classList.add("is-copied");
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => keyCopy.classList.remove("is-copied"), MOTION.copied);
  }
  function setCardCopied(on, sticky) {
    copyBtn.classList.toggle("is-copied", on);
    clearTimeout(cardCopyTimer);
    if (on && !sticky) cardCopyTimer = setTimeout(() => copyBtn.classList.remove("is-copied"), MOTION.copiedCard);
  }
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case "history":
        if (!card.hidden) requestCloseCard();
        else if (LVStage.state === "listening") LVStage.setState("history");
        else openCard();                               // open over transcribing / delivered / failed without changing state
        break;
      case "copy": copyText(LAST.text); flashKeyCopied(); break;
      case "cancel": LVStage.stopSequence(); LVStage.setState("idle"); break;
      case "reprocess":
        LVStage.stopSequence(); LVStage.setState("transcribing");
        reprocessTimer = setTimeout(() => { if (LVStage.state === "transcribing") LVStage.setState("delivered"); }, MOTION.reprocess);
        break;
      case "copy-card": copyText(FAILED.text); setCardCopied(true); break;
      case "dismiss": LVStage.setState("idle"); break;
    }
  });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!menu.hidden) closeMenu();
    else if (!card.hidden) requestCloseCard();
    else if (LVStage.state !== "idle") { LVStage.stopSequence(); LVStage.setState("idle"); }   // Esc = Cancel Dictation
  });
  function updateKeys(s) {
    const busy = s === "transcribing";                  // today: Copy and Reprocess disable while processing
    keyCopy.disabled = busy; keyReprocess.disabled = busy;
  }

  // ======================================================================================
  // Menu bar item: a slab with a four-bar phosphor trace inside. Template image (mono).
  // native: NSStatusItem button image, isTemplate = true; listening frames drawn per level.
  // ======================================================================================
  const slot = LVStage.menubarSlot();
  const MARK_X = [3.8, 6.2, 8.6, 11.0];
  const MARK_IDLE = [2.0, 4.4, 2.8, 1.4];
  slot.innerHTML = `<span class="lv-status ob-status" role="button" aria-haspopup="menu" aria-label="Liquid Voice" title="Liquid Voice">
    <svg class="ob-mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1.1" y="3.6" width="13.8" height="8.8" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
      ${MARK_X.map((x, i) => `<rect class="b" x="${x}" y="${8 - MARK_IDLE[i] / 2}" width="1.2" height="${MARK_IDLE[i]}" rx="0.6" fill="currentColor"/>`).join("")}
    </svg></span>`;
  const status = slot.firstElementChild;
  const markBars = [...status.querySelectorAll("rect.b")];
  let markH = MARK_IDLE.slice(), markAt = 0;
  function setMark(hs) { markBars.forEach((r, i) => { r.setAttribute("y", (8 - hs[i] / 2).toFixed(2)); r.setAttribute("height", hs[i].toFixed(2)); }); }
  function tickMark(t) {
    const s = LVStage.state;
    if (!(s === "listening" || s === "history") || RM.matches) return;
    if (t - markAt < 120) return;
    markAt = t;
    markH.shift();
    markH.push(1.2 + 5.2 * Math.pow(clamp01((curLevel - 0.25) / 0.75), 0.8));
    setMark(markH);
  }
  function updateMark(s) {
    status.dataset.s = s;
    if (s === "transcribing") setMark([1.2, 1.2, 1.2, 1.2]);
    else if (s === "listening" || s === "history") { markH = RM.matches ? [3.4, 5.6, 4.2, 2.4] : MARK_IDLE.slice(); setMark(markH); }
    else setMark(MARK_IDLE);
  }

  // ---------- the NSMenu (dark appearance; only the glyph and row text are really ours) ----------
  const menu = document.createElement("div");
  menu.className = "ob-menu"; menu.hidden = true; menu.setAttribute("role", "menu");
  document.body.appendChild(menu);
  function renderMenu() {
    const recording = LVStage.state === "listening" || LVStage.state === "history";
    menu.innerHTML = `
      <div class="ob-mi" data-mi="toggle" role="menuitem"><span>${recording ? "Stop Dictation" : "Start Dictation"}</span><kbd>⌥Space</kbd></div>
      <div class="ob-mi" data-mi="mic" role="menuitem" aria-haspopup="menu"><span>Microphone</span><em>${esc(mic)}</em>${GL.chev}</div>
      <div class="ob-mi" data-mi="history" role="menuitem"><span>History…</span></div>
      <div class="ob-mi" data-mi="settings" role="menuitem"><span>Settings…</span><kbd>⌘,</kbd></div>
      <div class="ob-msep"></div>
      <div class="ob-mi" data-mi="quit" role="menuitem"><span>Quit Liquid Voice</span><kbd>⌘Q</kbd></div>
      <div class="ob-sub" hidden role="menu">
        <div class="ob-mhead">Input</div>
        ${M.mics.map((m) => `<div class="ob-mi" data-mic="${esc(m.name)}" role="menuitemradio" aria-checked="${m.name === mic}">${m.name === mic ? `<span class="ob-tick">${GL.check}</span>` : ""}<span>${esc(m.name)}</span></div>`).join("")}
      </div>`;
  }
  function openMenu() {
    renderMenu();
    menu.hidden = false;
    status.classList.add("open");
    const r = status.getBoundingClientRect();
    menu.style.top = `${Math.round(r.bottom + 3)}px`;
    menu.style.left = `${Math.round(Math.min(r.left, window.innerWidth - menu.offsetWidth - 8))}px`;
  }
  function closeMenu() { menu.hidden = true; status.classList.remove("open"); }
  status.addEventListener("mousedown", (e) => { e.preventDefault(); e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); });
  document.addEventListener("mousedown", (e) => { if (!menu.hidden && !menu.contains(e.target) && !status.contains(e.target)) closeMenu(); });
  menu.addEventListener("mouseover", (e) => {
    const row = e.target.closest(".ob-mi"); if (!row) return;
    const sub = menu.querySelector(".ob-sub");
    const micRow = menu.querySelector('[data-mi="mic"]');
    if (row === micRow) { sub.hidden = false; micRow.classList.add("is-hi"); }
    else if (!sub.contains(row)) { sub.hidden = true; micRow.classList.remove("is-hi"); }
  });
  menu.addEventListener("click", (e) => {
    const row = e.target.closest(".ob-mi"); if (!row) return;
    if (row.dataset.mic) { mic = row.dataset.mic; closeMenu(); if (LVStage.state === "listening" && P.count === 0) renderLive(); return; }
    switch (row.dataset.mi) {
      case "mic": return;
      case "toggle": LVStage.stopSequence(); LVStage.setState(LVStage.state === "listening" || LVStage.state === "history" ? "transcribing" : "listening"); break;
      case "history": LVStage.stopSequence(); LVStage.setState("history"); break;
    }
    closeMenu();
  });

  // ======================================================================================
  // States
  // ======================================================================================
  let state = null;
  function onState(next) {
    if (next === state) return;
    const was = state;
    state = next;
    deliverAt = 0;
    clearTimeout(reprocessTimer);
    updateKeys(next);
    updateMark(next);
    if (!menu.hidden) renderMenu();

    if (next === "idle") { closeCard(); setCardCopied(false); dismiss(); LVStage.clearInserted(); return; }

    root.dataset.s = next;
    show();
    switch (next) {
      case "listening":
      case "history":
        if (!(was === "listening" || was === "history") || !rec.active) beginRecording(was == null);
        T.mode = "live";
        if (next === "history") { renderHistory(); openCard(); } else closeCard();
        break;
      case "transcribing":
        closeCard(); endRecording();
        T.mode = "sweep"; T.sweepT0 = now(); flatten(now());
        break;
      case "delivered":
        closeCard(); endRecording();
        T.mode = "done"; flatten(now());
        LVStage.insertText(esc(LAST.text.slice(0, 90)) + "…");
        if (!HOLD) deliverAt = now() + MOTION.delivered;
        break;
      case "failed":
        closeCard(); endRecording();
        T.mode = "off";
        setCardCopied(Q.get("copied") === "1", true);
        break;
    }
  }

  renderHistory();
  return { onState, draw, setLevel: (l) => { stageLevel = l; }, openMenu, list, keyHistory, keyCopy, $ };
  } // boot

  let api = null;
  const ensure = () => api || (api = boot());
  LVStage.init({
    name: "Obsidian",
    states: [
      { id: "idle", label: "Idle" }, { id: "listening", label: "Listening" }, { id: "transcribing", label: "Transcribing" },
      { id: "delivered", label: "Delivered" }, { id: "failed", label: "Failed → Copy" }, { id: "history", label: "History" },
    ],
    defaultState: "listening",
    sequence: [["listening", 4200], ["transcribing", 1100], ["delivered", 1300], ["idle", 0]],
    onState(next, prev) { ensure().onState(next, prev); },
    onTheme() { ensure().draw(performance.now()); },
    onTick(level) { ensure().setLevel(level); },
  });

  // ---------- screenshot / review helpers (URL only; no effect in normal use) ----------
  if (Q.get("menu") === "1") ensure().openMenu();
  if (Q.get("demo") === "keys") {
    const a = ensure();
    a.keyHistory.classList.add("is-hover");
    a.$('[data-act="cancel"]').classList.add("is-pressed");
    a.keyCopy.classList.add("is-copied");
    const row = a.list.querySelector(".ob-hrow:nth-child(2)"); if (row) row.classList.add("is-hover");
  }
})();
</script>
</body>
</html>
