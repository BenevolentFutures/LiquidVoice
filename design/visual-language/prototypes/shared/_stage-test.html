<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage test</title>
<link rel="stylesheet" href="stage.css">
</head><body>
<script src="mock-data.js"></script><script src="stage.js"></script>
<script>
const host = () => LVStage.host();
LVStage.init({
  name: "Stage",
  states: [{id:"idle",label:"Idle"},{id:"listening",label:"Listening"},{id:"transcribing",label:"Transcribing"},{id:"delivered",label:"Delivered"}],
  onState(next){ host().innerHTML = next === "idle" ? "" : `<div style="margin-bottom:50px;padding:14px 20px;border-radius:18px;background:#000;color:#fff;font:600 14px system-ui">state: ${next} · level <span id=lv></span></div>`; },
  onTick(level){ const e=document.getElementById('lv'); if(e) e.textContent=level.toFixed(2); },
});
</script></body></html>
