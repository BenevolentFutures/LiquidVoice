<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Voice · Signal</title>
<link rel="stylesheet" href="../shared/stage.css">
<style>
/* =====================================================================================
   SIGNAL v4: the overlay as an engineering drawing that stays quiet until you reach for it.
   Zero gradients, zero blur, zero glow, zero radius. Square solid surfaces, 1 px rules, SF Mono for
   every number and label, one accent (international orange). Schematic selection brackets draw
   OUTSIDE the box's corners, only under the pointer.

   Native mapping (SwiftUI / AppKit on macOS 15 and 26):
   - Surfaces: Rectangle().fill(surface) + .strokeBorder(edge, lineWidth: 1). No corner radius anywhere.
     Borderless non-activating NSPanel, hasShadow = false.
   - Drop rule: .shadow(color:, radius: 0, x: 0, y: 2) (a flat, unblurred offset), or a second
     shape offset y +2 behind the surface.
   - Selection brackets (.tk): one Path in the surface's .overlay, drawn OUTSIDE the frame
     (.padding(-(gap + 0.75)) so the stroke's inner edge sits `gap` pt clear of the box): four L
     sub-paths (move(to: corner + len along y), addLine(to: corner), addLine(to: corner + len along x)),
     stroked 1.5 pt, lineCap .butt, lineJoin .miter. .allowsHitTesting(false), no layout effect.
     Shown on .onHover with .opacity(hovering ? 1 : 0).animation(.linear(duration: 0.06)).
   - Voice trace and graticule: one Canvas in a TimelineView(.animation); fill(Path(rect)) per
     bar and per graticule tick, integer-snapped.
   - Type: .system(size:weight:) for prose; .system(size:weight:design: .monospaced) for every
     number and label, .textCase(.uppercase) + .tracking(0.6).
   ===================================================================================== */

:root {
  --sg-font: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", sans-serif;
  /* SF Mono. Safari resolves ui-monospace to SF Mono; Chrome cannot see the hidden system copy and
     falls back to Menlo, which has the same 0.6 em advance. Native: .monospaced design. */
  --sg-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --sg-accent: #FF4F1F;          /* international orange: the only colour in the system */
  --sg-on-accent: #111214;

  /* diagram grammar: schematic selection brackets, outside the box */
  --tk-len: 10px;                /* bracket arm length, measured from the outer vertex */
  --tk-w: 1.5px;                 /* bracket stroke */
  --tk-gap: 3px;                 /* clear space between the box edge and the bracket's inner edge */

  /* dark (default) */
  --sg-surface: #111214;
  --sg-edge: #2C2E33;
  --sg-chip: #1A1B1F;
  --sg-chip-edge: #2C2E33;
  --sg-drop: 0 2px 0 rgba(0, 0, 0, 0.35);
  --sg-ink: #FFFFFF;             /* trace ink */
  --sg-text: rgba(255, 255, 255, 0.92);
  --sg-text-2: rgba(255, 255, 255, 0.58);
  --sg-text-dim: rgba(255, 255, 255, 0.46);
  --sg-glyph: rgba(255, 255, 255, 0.85);
  --sg-glyph-off: rgba(255, 255, 255, 0.28);
  --sg-rule: #2C2E33;
  --sg-midline: #2C2E33;
  --sg-bracket: rgba(255, 255, 255, 0.78);  /* selection brackets (pill, card, chips) */
  --sg-grat: rgba(255, 255, 255, 0.20);     /* graticule and leader */
  --sg-inv-bg: #FFFFFF;
  --sg-inv-fg: #111214;
  --sg-inv-fg-2: rgba(17, 18, 20, 0.62);
  --sg-menu: #1A1B1F;
}
:root[data-appearance="light"] {
  --sg-surface: #FFFFFF;
  --sg-edge: #111214;
  --sg-chip: #F2F2F4;
  --sg-chip-edge: #111214;
  --sg-drop: 0 2px 0 #111214;
  --sg-ink: #111214;
  --sg-text: #111214;
  --sg-text-2: #111214;          /* print: secondary text is still true ink; size, case and weight carry it */
  --sg-text-dim: rgba(17, 18, 20, 0.50);
  --sg-glyph: #111214;
  --sg-glyph-off: rgba(17, 18, 20, 0.28);
  --sg-rule: #111214;
  --sg-midline: #D3D4D8;
  --sg-bracket: #111214;
  --sg-grat: rgba(17, 18, 20, 0.30);
  --sg-inv-bg: #111214;
  --sg-inv-fg: #FFFFFF;
  --sg-inv-fg-2: rgba(255, 255, 255, 0.66);
  --sg-menu: #FFFFFF;
}

/* ---------- the tick primitive: an 8-tick corner bracket (four L corners, nothing along the edges) ---------- */
/* Outside the box: no layout, no hit-testing. A surface with a drop rule measures its bottom gap from the rule's
   bottom edge (--tk-drop), so the bracket never doubles the printed rule. Each bracket is drawn twice: a 1 pt
   knockout halo in the surface colour (.tk-halo), then the ink stroke, so it reads over any backdrop (a black
   terminal behind a light-mode overlay, a white page behind a dark one). Native: stroke the same Path twice. */
.tk {
  --tk-o: calc(var(--tk-gap) + var(--tk-w) + var(--tk-hx, 0px));
  position: absolute; inset: calc(-1 * var(--tk-o)); bottom: calc(-1 * (var(--tk-o) + var(--tk-drop, 0px)));
  pointer-events: none; z-index: 2; opacity: 0; transition: opacity 60ms linear; color: var(--sg-bracket);
}
.tk.tk-halo { --tk-hx: 1px; --tk-l: calc(var(--tk-len) + 2px); --tk-s: calc(var(--tk-w) + 2px); color: var(--sg-surface); z-index: 1; }
.tk i { position: absolute; width: var(--tk-l, var(--tk-len)); height: var(--tk-l, var(--tk-len)); box-sizing: border-box; border: 0 solid currentColor; }
.tk i:nth-child(1) { top: 0; left: 0; border-top-width: var(--tk-s, var(--tk-w)); border-left-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(2) { top: 0; right: 0; border-top-width: var(--tk-s, var(--tk-w)); border-right-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: var(--tk-s, var(--tk-w)); border-left-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: var(--tk-s, var(--tk-w)); border-right-width: var(--tk-s, var(--tk-w)); }

/* ---------- overlay root: [rail] [pill] [rail], bottom-aligned ---------- */
.sg {
  --pill-w: 340px;
  --pill-h: 149px;               /* 12 + 54 preview + 6 + 50 trace row (44 trace + 6 ruler) + 4 + 13 mic + 10 */
  position: relative;
  display: flex; align-items: flex-end; gap: 6px;
  margin-bottom: 50px;
  font-family: var(--sg-font);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  user-select: none; -webkit-user-select: none;
  cursor: default;
}
.sg.is-hidden { opacity: 0; transition: opacity 120ms linear; pointer-events: none; }
.sg.is-gone { visibility: hidden; }

.sg-rail {
  position: relative; width: 30px; height: var(--pill-h);
  display: flex; flex-direction: column; justify-content: space-between;
}

/* ---------- chips: one style. At rest a solid square (the fill keeps glyphs legible over a busy terminal),
   no edge, no bracket. Hover draws a selection bracket OUTSIDE the chip (2 pt gap, 6 pt arms) in ink.
   Press and latch invert. ---------- */
.sg-chip {
  position: relative;
  width: 30px; height: 30px; padding: 0; margin: 0; border: 0; border-radius: 0; overflow: visible;
  background: var(--sg-chip); color: var(--sg-glyph); box-shadow: none;
  display: grid; place-items: center; cursor: default; outline: none;
  transition: background-color 60ms linear, color 60ms linear, box-shadow 60ms linear;
}
.sg-chip svg { display: block; width: 16px; height: 16px; }
.sg-chip .g-check { display: none; }
.sg-chip .tk { --tk-gap: 2px; --tk-len: 6px; }            /* chips carry no drop rule */
.sg-chip:hover:not(:disabled) .tk, .sg-chip.is-hover .tk { opacity: 1; }
/* Inverted (pressed, or latched while its card is open). A 1 px keyline in the surface colour keeps the key's
   shape on any backdrop: a black key over a black terminal would otherwise vanish. Native: an outer strokeBorder. */
.sg-chip.is-latched, .sg-chip.is-pressed {
  background: var(--sg-inv-bg); color: var(--sg-inv-fg); box-shadow: 0 0 0 1px var(--sg-surface);
}
.sg-chip.is-copied { background: var(--sg-accent); color: var(--sg-on-accent); box-shadow: none; }
.sg-chip.is-copied .g-main { display: none; }
.sg-chip.is-copied .g-check { display: block; }
.sg-chip:disabled { color: var(--sg-glyph-off); }
.sg-chip:focus-visible { box-shadow: inset 0 0 0 2px var(--sg-accent); }

/* ---------- pill ---------- */
.sg-pill {
  position: relative; width: var(--pill-w); box-sizing: border-box;
  padding: 12px 18px 10px;
  background: var(--sg-surface); border-radius: 0;
  box-shadow: inset 0 0 0 1px var(--sg-edge), var(--sg-drop);   /* 1 px edge + flat 2 pt drop rule, unblurred */
  overflow: visible;                                              /* the brackets live outside the frame */
  display: flex; flex-direction: column;
}
.sg-pill { --tk-drop: 2px; }
/* Brackets are a hover affordance that marks what is under the pointer: the pill's draw while the pointer is
   over the pill or the rails' empty gutter; over a chip or the history card, that element's own brackets draw
   instead (the 6 pt gutter cannot hold two brackets side by side). Never at rest, never orange. */
.sg:hover:not(:has(.sg-chip:not(:disabled):hover, .sg-hist:hover)) .sg-pill > .tk, .sg.is-hover .sg-pill > .tk { opacity: 1; }

.sg-top { position: relative; height: 54px; }           /* reserved: the 3-line preview, all non-failed states */
.sg-gap { height: 6px; flex: none; }                     /* + the trace's own 2 pt top margin = 8 */

/* trace row: [target-app icon 20] [trace] [■ 6] [timer, 5ch reserved], centred on the trace midline */
.sg-trace-row { height: 50px; flex: none; display: flex; align-items: flex-start; justify-content: space-between; }
.sg-app { width: 20px; height: 20px; flex: none; margin-top: 12px; }
.sg-app svg { display: block; }
.sg-trace { display: block; flex: none; height: 50px; }  /* 44 trace + 6 age ruler below; width set from the bar count */
.sg-readout {
  flex: none; margin-top: 13px; height: 18px;
  display: flex; align-items: center; gap: 4px;
  font: 600 15px/18px var(--sg-mono); color: var(--sg-text);
}
.sg-time { display: inline-block; width: 5ch; text-align: right; }   /* reserved for "99:59": never shifts */
.sg-dot { width: 6px; height: 6px; flex: none; box-sizing: border-box; }
.sg[data-state="listening"] .sg-dot, .sg[data-state="history"] .sg-dot { background: var(--sg-accent); }
.sg[data-state="transcribing"] .sg-dot { box-shadow: inset 0 0 0 1.5px var(--sg-accent); }

/* mic row: bottom centre, the same in every visible state */
.sg-mic {
  flex: none; margin-top: 4px; height: 13px; text-align: center;
  font: 500 10.5px/13px var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--sg-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.sg-preview { height: 54px; overflow: hidden; }
.sg-preview p { margin: 0; font: 500 13.5px/18px var(--sg-font); color: var(--sg-text); overflow-wrap: break-word; }
.sg[data-state="transcribing"] .sg-preview p { color: var(--sg-text-dim); }

/* delivered: swaps the preview for one statement of equal height */
.sg-rec { position: relative; height: 54px; }
.sg-done { position: absolute; inset: 0; display: none; align-items: center; gap: 14px; }
.sg-stamp { width: 30px; height: 30px; flex: none; border-radius: 0; background: var(--sg-accent); color: var(--sg-on-accent); display: grid; place-items: center; }
.sg-done-text { display: flex; flex-direction: column; gap: 3px; }
.sg-done-text b { font: 600 16px/20px var(--sg-font); color: var(--sg-text); }
.sg-done-text span { font: 500 10.5px/14px var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sg-text-2); }
.sg[data-state="delivered"] .sg-rec { visibility: hidden; }
.sg[data-state="delivered"] .sg-done { display: flex; }

/* failed: the pill grows upward; rails (fixed height, bottom-aligned) and trace stay put */
.sg-fail { display: none; }
.sg-fail-rule { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--sg-accent); display: none; }
.sg[data-state="failed"] .sg-top { height: auto; }
.sg[data-state="failed"] .sg-rec { display: none; }
.sg[data-state="failed"] .sg-fail { display: block; }
.sg[data-state="failed"] .sg-fail-rule { display: block; }
.sg-fail h3 { margin: 0; font: 600 13.5px/18px var(--sg-font); color: var(--sg-text); }
.sg-fail p {
  margin: 6px 0 0; height: 51px; font: 400 13px/17px var(--sg-font); color: var(--sg-text);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.sg-actions { margin-top: 12px; height: 28px; display: flex; align-items: center; gap: 16px; }
.sg-copy {
  width: 88px; height: 28px; padding: 0; border: 0; border-radius: 0;
  background: var(--sg-accent); color: var(--sg-on-accent);
  font: 600 13px/28px var(--sg-font); cursor: default; outline: none;
  display: grid; place-items: center;
  transition: background-color 60ms linear, color 60ms linear;
}
.sg-copy > span { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 5px; }
.sg-copy .b { visibility: hidden; }
.sg-copy.is-copied .a { visibility: hidden; }
.sg-copy.is-copied .b { visibility: visible; }
.sg-copy.is-pressed { background: var(--sg-inv-bg); color: var(--sg-inv-fg); }
.sg-dismiss {
  height: 28px; padding: 0; border: 0; background: none; color: var(--sg-text);
  font: 500 13px/28px var(--sg-font); cursor: default; outline: none;
  text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; text-decoration-thickness: 1px;
}
.sg-dismiss:hover { text-decoration-color: currentColor; }
.sg-dismiss.is-pressed { color: var(--sg-accent); }
.sg-fail-meta { margin-left: auto; font: 500 10.5px/28px var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sg-text-2); }

/* ---------- history card: an engineering table ---------- */
.sg-hist {
  position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 5;
  width: 480px; max-height: 480px; box-sizing: border-box;
  background: var(--sg-surface); border-radius: 0;
  border: 1px solid var(--sg-edge);                    /* a real border: an inverted row never paints over it */
  box-shadow: var(--sg-drop);
  overflow: visible; display: none; flex-direction: column;   /* the list scrolls; the brackets sit outside */
}
.sg-hist { --tk-drop: 2px; }
.sg-hist > .tk { --tk-gap: 4px; }   /* absolute children start at the padding edge: 1 pt border + 3 pt clear */
.sg-hist:hover > .tk { opacity: 1; }
.sg-hist.is-open { display: flex; }
/* The failed card grows the pill 61 pt above the rail (210 vs 149); a history card opened then clears it. */
.sg[data-state="failed"] .sg-hist { bottom: calc(100% + 6px + 61px); }
.sg-hist header, .sg-hist footer {
  flex: none; padding: 0 19px; display: flex; align-items: center; justify-content: space-between;
  font: 500 10px/1 var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sg-text-2);
}
.sg-hist header { height: 36px; box-shadow: inset 0 -1px 0 var(--sg-rule); }
.sg-hist header b { font-weight: 600; color: var(--sg-text); }
/* Title block: a ruled strip on the card's bottom edge, two cells. */
.sg-hist footer { height: 28px; padding: 0; box-shadow: inset 0 1px 0 var(--sg-rule); }
.sg-hist footer span { padding: 0 19px; height: 100%; display: flex; align-items: center; }
.sg-hist footer span + span { box-shadow: inset 1px 0 0 var(--sg-rule); color: var(--sg-text); font-weight: 600; }
.sg-hist ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; scrollbar-width: none; flex: 1 1 auto; min-height: 0; }
.sg-hist ol::-webkit-scrollbar { display: none; }
.sg-hday {
  height: 28px; padding: 0 19px; display: flex; align-items: center;
  font: 500 10px/1 var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sg-text-2);
  border-top: 1px solid var(--sg-rule);
}
.sg-hday:first-child { border-top: 0; }
.sg-hrow {
  --c1: var(--sg-text); --c2: var(--sg-text-2);
  display: grid; grid-template-columns: 68px 1fr; padding: 11px 19px 12px;
  border-top: 1px solid var(--sg-rule); cursor: default;
}
.sg-hrow:hover, .sg-hrow.is-hover { background: var(--sg-inv-bg); --c1: var(--sg-inv-fg); --c2: var(--sg-inv-fg-2); }
.sg-hidx { display: flex; flex-direction: column; gap: 3px; font: 600 11.5px/17px var(--sg-mono); color: var(--c2); }
.sg-hidx span { font: 500 10px/14px var(--sg-mono); letter-spacing: 0.04em; }
.sg-hbody p {
  margin: 0; font: 400 13px/18px var(--sg-font); color: var(--c1);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
}
.sg-hmeta { margin-top: 6px; display: flex; align-items: center; font: 500 10.5px/15px var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c2); }
.sg-flag { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; font-weight: 600; color: var(--c1); }
.sg-flag i { width: 6px; height: 6px; background: var(--sg-accent); }

/* ---------- menu bar item + menu ---------- */
#lv-menubar-slot .lv-status { justify-content: center; color: inherit; }
#lv-menubar-slot .lv-status svg { display: block; }
#lv-menubar-slot .lv-status .mb-bracket { opacity: 0; transition: opacity 60ms linear; }
#lv-menubar-slot .lv-status:hover .mb-bracket, #lv-menubar-slot .lv-status.open .mb-bracket { opacity: 1; }
.sg-menu {
  position: fixed; z-index: 120; min-width: 262px; box-sizing: border-box; padding: 5px;
  background: var(--sg-menu); color: var(--sg-text); border-radius: 0;
  box-shadow: inset 0 0 0 1px var(--sg-edge), var(--sg-drop);
  font: 400 13px/1 var(--sg-font); display: none;
}
.sg-menu.is-open { display: block; }
.sg-mh {
  height: 24px; padding: 0 9px; display: flex; align-items: center; justify-content: space-between;
  font: 500 10px/1 var(--sg-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sg-text-2);
}
.sg-mh b { font-weight: 600; color: var(--sg-text); display: inline-flex; align-items: center; gap: 6px; }
.sg-mh b i { width: 6px; height: 6px; background: var(--sg-accent); display: none; }
.sg-mh b.on i { display: block; }
.sg-mi {
  height: 22px; padding: 0 9px; border-radius: 0; display: flex; align-items: center; gap: 8px;
  color: var(--sg-text); white-space: nowrap;
}
.sg-mi > span { flex: 1; }
.sg-mi kbd, .sg-mi em { font: 400 13px/1 var(--sg-font); font-style: normal; color: var(--sg-text-2); }
.sg-mi svg { flex: none; color: var(--sg-text-2); }
.sg-mi:hover { background: var(--sg-inv-bg); color: var(--sg-inv-fg); }
.sg-mi:hover kbd, .sg-mi:hover em, .sg-mi:hover svg { color: var(--sg-inv-fg-2); }
.sg-msep { height: 1px; margin: 5px 9px; background: var(--sg-rule); }
:root[data-appearance="light"] .sg-msep { background: rgba(17, 18, 20, 0.16); }

/* ---------- prototype-only: "Signal options" strip under the stage's controls (uses the stage's own classes) ---------- */
.proto-controls.sg-options { top: 0; }
.sg-options .row:last-of-type { margin-bottom: 0; }
.sg-options .hint { margin-top: 6px; }

@media (prefers-reduced-motion: reduce) {
  .sg.is-hidden { transition: none; }
}
</style>
</head>

<script>
(function () {
  "use strict";
  const M = window.LV_MOCK;
  const H0 = M.history[0];
  const MIC = M.mics[0].name;
  const TARGET = H0.target;                       // "c11"
  const params = new URLSearchParams(location.search);
  const HOLD = params.get("hold") === "1";        // keep "delivered" on screen (screenshots)
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HISTORY_TOTAL = 247;                      // entries in the store; the card lists the newest 12

  // Prototype option, persisted in the URL: density=quiet|drawn (the age ruler under the trace).
  const OPT = { density: params.get("density") === "quiet" ? "quiet" : "drawn" };

  // ---------------------------------------------------------------- timing tokens
  const T_BAR = 60;          // bar morph, linear
  const T_SAMPLE = 1000 / 12;// 12 samples/s (the real tap delivers ~11.7/s), so 12 bars = 1 s on the graticule
  const T_SWEEP = 1050;      // transcribing sweep period, linear
  const T_DELIVERED = 1200;  // delivered confirmation, then dismiss
  const T_PRESS = 60;        // minimum visible press
  const T_COPIED = 900;      // copy feedback
  const PREROLL_S = 37;      // the state picker opens mid-dictation so the steady state is visible

  // Live streaming preview: LV_MOCK.livePreview[0], continued as the same raw ASR draft of history[0].
  const STREAM = (M.livePreview[0] + " worker sees the same job id land twice inside the lease window we are admitting both and the second one clobbers the first ones checkpoint so i think the fix is to key the admission set on job id plus lease epoch instead of just job id write a failing test first that reproduces the double admission then fix it then run the whole queue suite and do not touch the scheduler when you are done give me a one line summary and the diff stat and if the suite takes longer than a minute tell me which tests are slow so we can look at them after this lands and then close the worktree").split(" ");
  const WPS = H0.words / H0.seconds;              // 118 words over 41 s

  // ---------------------------------------------------------------- glyphs (SF Symbol stand-ins, 1.75 stroke)
  const G = {
    // SF Symbol: clock.arrow.circlepath
    history: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 10.6 A5.25 5.25 0 1 0 4.3 5.9"/><path d="M2.3 3.9 L4.1 6.3 L6.6 4.8"/><path d="M9.2 5.3 V8.4 L11.2 9.7"/></svg>',
    // SF Symbol: doc.on.doc
    copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="5.1" width="7.6" height="9.1" rx="1.6"/><path d="M5.6 5.1 V3.4 A1.6 1.6 0 0 1 7.2 1.8 H11.9 A1.6 1.6 0 0 1 13.5 3.4 V9.5 A1.6 1.6 0 0 1 11.9 11.1 H10"/></svg>',
    // SF Symbol: xmark
    cancel: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4.4 4.4 L11.6 11.6 M11.6 4.4 L4.4 11.6"/></svg>',
    // SF Symbol: arrow.clockwise

  };
  const TK = '<span class="tk tk-halo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="tk" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';

  const APP_C11 = '<svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" rx="4.5" fill="#0D0F14"/><rect x="0.5" y="0.5" width="19" height="19" rx="4" fill="none" stroke="rgba(255,255,255,0.18)"/><path d="M5.6 6.8 L8.8 10 L5.6 13.2" fill="none" stroke="#E8EAF0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 13.2 H14.4" stroke="#E8EAF0" stroke-width="1.6" stroke-linecap="round"/></svg>';

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad2 = (n) => String(n).padStart(2, "0");
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const fmt = (s) => LV.fmtDuration(Math.max(0, Math.floor(s)));

  // ---------------------------------------------------------------- build the overlay
  function chip(id, title, glyph) {
    return `<button class="sg-chip" data-chip="${id}" title="${title}" aria-label="${title}">${TK}<span class="g-main">${glyph}</span><span class="g-check">${G.check}</span></button>`;
  }
  function historyRows() {
    let html = "", lastDay = null;
    M.history.slice(0, 12).forEach((h, i) => {
      const day = LV.fmtDay(h.when);
      if (day !== lastDay) {
        const d = new Date(h.when);
        const date = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        html += `<li class="sg-hday" aria-hidden="true">${day} · ${date}</li>`;

      html += `<li class="sg-hrow" data-i="${i}" role="button" title="Insert this dictation into the focused app">
        <div class="sg-hidx"><b>${pad2(i + 1)}</b><span>${LV.fmtTime(h.when)}</span></div>
        <div class="sg-hbody"><p>${esc(h.text)}</p><div class="sg-hmeta">${LV.fmtDuration(h.seconds)} · ${h.words} words · ${esc(h.target)}${flag}</div></div>
      </li>`;
    });
    return html;
  }

  const host = () => LVStage.host();
  const root = document.createElement("div");
  root.className = "sg is-hidden is-gone";
  root.dataset.density = OPT.density;
  root.innerHTML = `
    <div class="sg-rail sg-lead">
      ${chip("history", "Recent Dictations", G.history)}
      ${chip("copy", "Copy Last Transcription", G.copy)}
      <div class="sg-hist" data-nodrag role="dialog" aria-label="Recent dictations">
        ${TK}
        <header><b>Recent dictations</b><span>Click to insert</span></header>
        <ol>${historyRows()}</ol>
        <footer><span>History · ${Math.min(12, M.history.length)} of ${HISTORY_TOTAL} · Newest first</span><span>Liquid Voice</span></footer>
      </div>
    </div>
    <div class="sg-pill">
      <i class="sg-fail-rule"></i>
      ${TK}
      <div class="sg-top">
        <div class="sg-rec">

        </div>
        <div class="sg-done" aria-live="polite">
          <span class="sg-stamp">${G.check.replace('viewBox', 'width="18" height="18" viewBox').replace('stroke-width="2"', 'stroke-width="2.25"')}</span>
          <span class="sg-done-text"><b>Delivered to ${esc(TARGET)}</b><span class="sg-done-meta"></span></span>
        </div>
        <div class="sg-fail" role="alert">
          <h3>Couldn’t paste into ${esc(TARGET)}</h3>
          <p>${esc(H0.text)}</p>
          <div class="sg-actions">
            <button class="sg-copy" title="Copy the transcription to the clipboard"><span class="a">Copy</span><span class="b">${G.check.replace('viewBox', 'width="13" height="13" viewBox').replace('stroke-width="2"', 'stroke-width="2.25"')}Copied</span></button>

            <span class="sg-fail-meta">${H0.words} words</span>
          </div>
        </div>
      </div>
      <div class="sg-gap"></div>
      <div class="sg-trace-row">
        <span class="sg-app" title="Dictation target app">${APP_C11}</span>
        <canvas class="sg-trace"></canvas>
        <span class="sg-readout"><i class="sg-dot"></i><span class="sg-time">0:00</span></span>
      </div>
      <div class="sg-mic" title="Microphone">${esc(MIC)}</div>
    </div>
    <div class="sg-rail sg-trail">
      ${chip("cancel", "Cancel Dictation (Esc)", G.cancel)}
      ${chip("reprocess", "Reprocess Last Dictation", G.reprocess)}

  const $ = (s) => root.querySelector(s);
  const el = {
    time: $(".sg-time"), preview: $(".sg-preview p"),
    doneMeta: $(".sg-done-meta"), hist: $(".sg-hist"), canvas: $(".sg-trace"),
    copyBtn: $(".sg-copy"), dismissBtn: $(".sg-dismiss"),
    chips: Object.fromEntries([...root.querySelectorAll(".sg-chip")].map((b) => [b.dataset.chip, b])),

  // ---------------------------------------------------------------- voice trace + graticule (one Canvas)
  // 52 bars on the 4 pt pitch (2 pt bars, 2 pt gaps) = 206 pt: the row now also holds the timer, so the trace
  // keeps its grain and gets shorter (4.3 s of history) rather than finer.
  const N = 52, BAR = 2, PITCH = 4, TW = N * PITCH - 2, TH = 44, CH = 50, MID = 22, HMIN = 2, HMAX = 40, HEAD = 6, SWEEP_W = 24;
  const PER_S = 12;          // bars per second of history (T_SAMPLE = 1000 / 12)
  const tr = {
    prev: new Float32Array(N).fill(HMIN), cur: new Float32Array(N).fill(HMIN),
    lastPush: 0, n: 0, acc: 0, accT: 0, live: false, sweep: false, sweepT0: 0,
  };
  const ctx = el.canvas.getContext("2d");
  let dpr = 1, C = {};
  function sizeCanvas() {
    dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    el.canvas.width = TW * dpr; el.canvas.height = CH * dpr;
    el.canvas.style.width = TW + "px";
  }
  function readColours() {
    const cs = getComputedStyle(document.documentElement);
    const v = (k) => cs.getPropertyValue(k).trim();
    C = { ink: v("--sg-ink"), accent: v("--sg-accent"), mid: v("--sg-midline"), grat: v("--sg-grat") };
  }
  // Four printed opacity steps by age band (age 0 = newest). Newest 6 are the accent write head.
  function band(age) { return age < 18 ? 1 : age < 29 ? 0.7 : age < 40 ? 0.45 : 0.25; }
  function heightFor(level) {
    const adjusted = clamp01((level - 0.4) / 0.6);
    const amp = Math.pow(adjusted, 1.15);
    const grain = 0.6 + 0.25 * Math.cos(1.7 * tr.n) + 0.15 * Math.cos(4.3 * tr.n);
    tr.n = (tr.n + 1) % 1024;
    return Math.max(HMIN, Math.min(HMAX, HMIN + (HMAX - HMIN) * amp * grain));
  }
  function push(h, now) {
    // FIFO: every slot morphs to its right neighbour's value over T_BAR (reads as flow to the left).
    for (let i = 0; i < N; i++) tr.prev[i] = shown(i, now);
    tr.cur.copyWithin(0, 1); tr.cur[N - 1] = h;
    tr.lastPush = now;
  }
  function shown(i, now) {
    const f = REDUCED ? 1 : Math.min(1, (now - tr.lastPush) / T_BAR);
    return tr.prev[i] + (tr.cur[i] - tr.prev[i]) * f;
  }
  function flatten(now) {
    for (let i = 0; i < N; i++) tr.prev[i] = shown(i, now);
    tr.cur.fill(HMIN); tr.lastPush = now;
  }
  function preroll() {
    // Fill the trace from the stage's own envelope (the tail of its 60 s loop, which then wraps to t = 0).
    tr.n = 0;
    for (let k = N; k > 0; k--) {
      const t0 = 60 - k * (T_SAMPLE / 1000);
      let lv = 0; for (let s = 0; s < 5; s++) lv = Math.max(lv, LVStage.envelope(t0 + s * 0.016));
      tr.cur.copyWithin(0, 1); tr.cur[N - 1] = heightFor(lv);
    }
    tr.prev.set(tr.cur); tr.lastPush = 0;
  }
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, TW, CH);
    ctx.globalAlpha = 1; ctx.fillStyle = C.mid;
    ctx.fillRect(0, MID - 0.5, TW, 1);                       // 1 px midline rule, full width, behind the bars
    for (let i = 0; i < N; i++) {
      const age = N - 1 - i;
      const h = Math.max(HMIN, Math.round(shown(i, now) / 2) * 2);   // even heights: symmetric, pixel-exact
      const x = TW - BAR - age * PITCH;
      const head = tr.live && age < HEAD;
      ctx.fillStyle = head ? C.accent : C.ink;
      ctx.globalAlpha = head ? 1 : band(age);
      ctx.fillRect(x, MID - h / 2, BAR, h);
    }
    if (tr.sweep) {
      // Solid 24 pt accent block, stepped on the bar pitch so its edges always sit on the grid.
      let p = ((now - tr.sweepT0) % T_SWEEP) / T_SWEEP;
      if (REDUCED) p = Math.floor(p * 4) / 4 + 0.125;
      const x = 1 + Math.round((-SWEEP_W + p * (TW + SWEEP_W)) / PITCH) * PITCH;
      ctx.globalAlpha = 1; ctx.fillStyle = C.accent;
      ctx.fillRect(x, MID - 2, SWEEP_W, 4);
    }
    if (OPT.density === "drawn") {
      // Age ruler: static, on the bar grid (a tick at each bar's centre), between the trace and the mic row.
      // Minor every 0.25 s (3 bars), 1 s ticks taller. Rule colour, never animated. Quiet keeps the 6 pt empty.
      ctx.globalAlpha = 1; ctx.fillStyle = C.grat;
      for (let age = 0; age < N; age += 3) {

  // ---------------------------------------------------------------- recording model
  const rec = { t0: 0, offset: 0, frozen: null, words: 0, fitK: 0, visible: false };
  let wantFresh = false;             // set by Space / Play / menu, so a real dictation starts at 0:00
  function elapsed() { return rec.frozen != null ? rec.frozen : (performance.now() - rec.t0) / 1000 + rec.offset; }
  function startRecording(fresh) {
    rec.t0 = performance.now(); rec.offset = fresh ? 0 : PREROLL_S; rec.frozen = null; rec.words = -1; rec.fitK = 0;

    const count = wordsAt(elapsed());

    const words = STREAM.slice(0, count), p = el.preview, maxH = 54 + 1;
    if (!words.length) { p.textContent = ""; return; }
    let k = Math.min(rec.fitK, words.length - 1);
    const set = () => { p.textContent = (k > 0 ? "…" : "") + words.slice(k).join(" "); };
    set();
    while (p.scrollHeight > maxH && k < words.length - 1) { k++; set(); }   // head truncation: newest words stay
    rec.fitK = k;
  }
  function renderTimer() { el.time.textContent = fmt(elapsed()); }

  // ---------------------------------------------------------------- state
  let doneTimer = null, rafId = null;
  function show() {
    root.classList.remove("is-hidden", "is-gone");      // entrance: instant, the panel is simply there
    rec.visible = true; loop();
  }
  function hide() {
    if (root.classList.contains("is-hidden")) return;
    root.classList.add("is-hidden");                    // dismiss: 120 ms linear opacity
    rec.visible = false;
    setTimeout(() => { if (root.classList.contains("is-hidden")) root.classList.add("is-gone"); }, REDUCED ? 0 : 130);
  }
  function loop() {
    if (rafId) return;
    const step = (now) => {
      rafId = null;
      if (!rec.visible) return;
      const st = LVStage.state;
      if (st === "listening" || st === "history") {
        // Accumulate the peak level over each sample window, then push one bar.
        tr.acc = Math.max(tr.acc, LVStage.level);
        if (now - tr.accT >= T_SAMPLE) { push(heightFor(tr.acc), now); tr.acc = 0; tr.accT = now; }
        renderTimer(); renderPreview();
      }
      draw(now);
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  function onState(next, prev) {
    mount();
    clearTimeout(doneTimer);
    root.dataset.state = next;
    setMenubar(next);
    if (next === "idle") { closeHistory(false); hide(); LVStage.clearInserted(); return; }
    const live = next === "listening" || next === "history";
    if (live) {
      const continuing = (prev === "listening" || prev === "history") && !wantFresh;
      if (!continuing) startRecording(wantFresh);
      wantFresh = false;
      tr.live = true; tr.sweep = false;
      setChipsEnabled(true);
      renderTimer(); rec.words = -1;
    } else {
      // Recording has ended: freeze the readout at the recorded length (0:41 when entered directly).
      const wasLive = prev === "listening" || prev === "history";
      if (wasLive) rec.frozen = elapsed();
      else if (rec.frozen == null || prev === "idle" || prev == null) { rec.frozen = H0.seconds; rec.fitK = 0; rec.words = -1; rec.offset = 0; }
      tr.live = false;
      flatten(performance.now());
      renderTimer();
      renderPreview();
      tr.sweep = next === "transcribing";
      tr.sweepT0 = performance.now();
      setChipsEnabled(next !== "transcribing");

    if (next === "history") openHistory(); else closeHistory(false);
    if (next === "delivered") {
      const s = rec.frozen != null ? rec.frozen : H0.seconds;
      el.doneMeta.textContent = `${Math.max(1, wordsAt(s))} words`;      // the duration is the frozen timer beside the trace
      LVStage.insertText(esc(H0.text.slice(0, 90)) + "…");

  }
  function setChipsEnabled(on) {

  }

  // ---------------------------------------------------------------- history card
  function openHistory() { el.hist.classList.add("is-open"); el.chips.history.classList.add("is-latched"); el.hist.querySelector("ol").scrollTop = 0; }
  function closeHistory(sync) {
    const was = el.hist.classList.contains("is-open");
    el.hist.classList.remove("is-open"); el.chips.history.classList.remove("is-latched");

  el.hist.addEventListener("click", (e) => {

  document.addEventListener("mousedown", (e) => {
    if (!el.hist.classList.contains("is-open")) return;

  // ---------------------------------------------------------------- chips and buttons
  function pressable(btn) {
    let t0 = 0, tm = null;
    btn.addEventListener("pointerdown", () => { if (btn.disabled) return; clearTimeout(tm); t0 = performance.now(); btn.classList.add("is-pressed"); });
    const up = () => { if (!btn.classList.contains("is-pressed")) return; tm = setTimeout(() => btn.classList.remove("is-pressed"), Math.max(0, T_PRESS - (performance.now() - t0))); };
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, up));
  }
  Object.values(el.chips).forEach(pressable); pressable(el.copyBtn); pressable(el.dismissBtn);
  function toClipboard(text) { try { const p = navigator.clipboard && navigator.clipboard.writeText(text); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  let copyTm = null, copyBtnTm = null;
  function copiedChip() {
    const b = el.chips.copy; b.classList.add("is-copied"); clearTimeout(copyTm);
    copyTm = setTimeout(() => b.classList.remove("is-copied"), T_COPIED);
  }
  el.chips.history.addEventListener("click", () => {

  el.chips.cancel.addEventListener("click", () => { LVStage.stopSequence(); LVStage.setState("idle"); });
  let reprocTm = null;
  el.chips.reprocess.addEventListener("click", () => {

  // A real dictation (Space, Play, menu) starts at 0:00. Capture phase runs before the stage's handlers.
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === " " && !e.repeat) wantFresh = true;
    if ((e.key === "p" || e.key === "P") && !e.repeat) wantFresh = true;
    if (e.key === "Escape") { closeMenu(); if (LVStage.state !== "idle") { LVStage.stopSequence(); LVStage.setState("idle"); } }

  }, true);
  document.addEventListener("click", (e) => { if (e.target.closest("#lv-play")) wantFresh = true; }, true);

  // ---------------------------------------------------------------- menu bar item
  // 22 x 16 template glyph (NSImage, isTemplate = true). Bars on the left, a record-square slot on the right,
  // so the item never changes width and the bars never move:
  //   idle          the three bars
  //   listening     + a solid square beside them; the bars follow the live level (8 Hz, 2 pt steps). Never blinks.
  //   transcribing  + the square outlined: input closed, working
  //   hover / open  a 4-corner bracket draws around the whole mark (the same corner grammar as the overlay)
  const MB_BRACKET = '<path class="mb-bracket" d="M0.75 4.75V0.75H4.75M17.25 0.75H21.25V4.75M21.25 11.25V15.25H17.25M4.75 15.25H0.75V11.25" fill="none" stroke="currentColor" stroke-width="1.5"/>';
  function barsPath(hs) { return hs.map((h, i) => { const x = 4 + i * 3, y = 8 - h / 2; return `M${x} ${y}h2v${h}h-2Z`; }).join(""); }
  function glyph(kind, hs) {
    const open = '<svg width="22" height="16" viewBox="0 0 22 16" fill="currentColor" aria-hidden="true">';
    const bars = `<path d="${barsPath(hs || [6, 10, 7])}"/>`;
    const sq = kind === "listening" ? '<rect x="14" y="5" width="6" height="6"/>'
      : kind === "transcribing" ? '<rect x="14.75" y="5.75" width="4.5" height="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>' : "";
    return open + MB_BRACKET + bars + sq + "</svg>";
  }
  let statusEl = null;
  let mbKind = "idle", mbLast = 0, mbKey = "";
  function setMenubar(state) {
    mbKind = state === "listening" || state === "history" ? "listening" : state === "transcribing" ? "transcribing" : "idle";
    mbKey = ""; paintMenubar();
    renderMenuHead();
  }
  function paintMenubar(hs) {
    const key = mbKind + (hs ? hs.join(",") : "");
    if (key === mbKey || !statusEl) return; mbKey = key;
    statusEl.innerHTML = glyph(mbKind, hs);
  }
  LVStage.onTick(() => {
    const now = performance.now();
    if (mbKind !== "listening" || now - mbLast < 125) return;
    mbLast = now;
    // The bars read three recent trace samples, quantised to 2 pt steps. The floor keeps the mark's own
    // silhouette in silence (never three dots, which would read as an overflow "…").
    const floor = [4, 6, 4], cap = [10, 12, 10];
    const hs = [4, 1, 7].map((age, k) => { const v = (tr.cur[N - 1 - age] - HMIN) / (HMAX - HMIN); return Math.min(cap[k], floor[k] + 2 * Math.round(v * 3)); });
    paintMenubar(hs);
    renderMenuHead();
  });

  const menu = document.createElement("div");
  menu.className = "sg-menu"; menu.setAttribute("role", "menu");
  menu.innerHTML = `
    <div class="sg-mh"><span>Liquid Voice</span><b><i></i><span class="sg-mh-state">Ready</span></b></div>
    <div class="sg-msep"></div>
    <div class="sg-mi" data-act="toggle" role="menuitem"><span class="sg-mi-toggle">Start Dictation</span><kbd>⌥Space</kbd></div>
    <div class="sg-mi" data-act="mic" role="menuitem"><span>Microphone</span><em>${esc(MIC)}</em>${G.chev}</div>
    <div class="sg-mi" data-act="history" role="menuitem"><span>History…</span></div>
    <div class="sg-mi" data-act="settings" role="menuitem"><span>Settings…</span><kbd>⌘,</kbd></div>
    <div class="sg-msep"></div>
    <div class="sg-mi" data-act="quit" role="menuitem"><span>Quit Liquid Voice</span><kbd>⌘Q</kbd></div>`;
  document.body.appendChild(menu);
  function renderMenuHead() {
    const st = LVStage.state, live = st === "listening" || st === "history";
    const head = menu.querySelector(".sg-mh b");
    head.classList.toggle("on", live);
    menu.querySelector(".sg-mh-state").textContent = live ? `Listening ${fmt(elapsed())}` : st === "transcribing" ? "Working" : "Ready";
    menu.querySelector(".sg-mi-toggle").textContent = live ? "Stop Dictation" : "Start Dictation";
  }
  function openMenu() {
    const r = statusEl.getBoundingClientRect();
    menu.classList.add("is-open");
    const w = menu.offsetWidth;
    menu.style.left = Math.min(r.left, window.innerWidth - w - 8) + "px";
    menu.style.top = (r.bottom + 4) + "px";
    statusEl.classList.add("open"); renderMenuHead();
  }
  function closeMenu() { menu.classList.remove("is-open"); if (statusEl) statusEl.classList.remove("open"); }
  document.addEventListener("mousedown", (e) => { if (!e.target.closest(".sg-menu, .lv-status")) closeMenu(); });
  menu.addEventListener("click", (e) => {
    const item = e.target.closest(".sg-mi"); if (!item) return;
    const act = item.dataset.act;
    if (act === "mic") return;                       // submenu row: the native NSMenu opens the device list
    closeMenu();
    if (act === "toggle") {
      LVStage.stopSequence();
      const st = LVStage.state;
      if (st === "listening" || st === "history") { LVStage.setState("transcribing"); setTimeout(() => { if (LVStage.state === "transcribing") LVStage.setState("delivered"); }, 1100); }
      else { wantFresh = true; LVStage.setState("listening"); }
    } else if (act === "history") { LVStage.stopSequence(); LVStage.setState("history"); }
  });

  // ---------------------------------------------------------------- prototype options strip (round 2)
  // Sits directly under the stage's controls panel and borrows its classes, so it matches without
  // touching shared/. Density: Quiet | Drawn (the age ruler under the trace). Persists in the URL. Key: D.
  const opts = document.createElement("div");
  opts.className = "proto-controls sg-options";
  opts.innerHTML = `
    <h1>Signal options</h1>
    <div class="row"><label>Density</label><div class="seg" data-opt="density">
      <button data-v="quiet">Quiet</button><button data-v="drawn">Drawn</button></div></div>
    <p class="hint"><b>D</b> toggles density: Drawn shows the age ruler under the trace. It stays in the URL.</p>`;
  opts.querySelector("h1").addEventListener("click", () => opts.classList.toggle("collapsed"));
  opts.addEventListener("click", (e) => {
    const b = e.target.closest(".seg button"); if (!b) return;
    setOption(b.parentElement.dataset.opt, b.dataset.v);
  });
  function paintOptions() {
    opts.querySelectorAll(".seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) =>
      b.setAttribute("aria-pressed", String(OPT[seg.dataset.opt] === b.dataset.v))));
  }
  function setOption(key, value) {
    OPT[key] = value;
    root.dataset[key] = value;
    paintOptions();
    try {
      const q = new URLSearchParams(location.search); q.set(key, value);
      history.replaceState(null, "", location.pathname + "?" + q.toString());
    } catch (_) {}
  }
  function placeOptions() {
    const ctl = document.getElementById("lv-controls"); if (!ctl) return;
    opts.style.top = Math.round(ctl.getBoundingClientRect().bottom + 8) + "px";
  }

  // ---------------------------------------------------------------- init
  // The stage builds its DOM inside init() and then fires the first onState, so mount lazily there.
  let mounted = false;
  function mount() {
    if (mounted) return; mounted = true;
    host().appendChild(root);
    LVStage.makeDraggable(root, "signal");
    const slot = LVStage.menubarSlot();
    slot.innerHTML = `<span class="lv-status" role="button" aria-label="Liquid Voice" title="Liquid Voice"></span>`;
    statusEl = slot.firstElementChild;
    statusEl.addEventListener("mousedown", (e) => { e.stopPropagation(); menu.classList.contains("is-open") ? closeMenu() : openMenu(); });
    sizeCanvas(); readColours();
    window.addEventListener("resize", () => { sizeCanvas(); placeOptions(); });
    document.body.appendChild(opts); paintOptions();
    const ctl = document.getElementById("lv-controls");
    if (ctl && window.ResizeObserver) new ResizeObserver(placeOptions).observe(ctl);
    placeOptions();
  }

  LVStage.init({
    name: "Signal",
    states: [
      { id: "idle", label: "Idle" }, { id: "listening", label: "Listening" }, { id: "transcribing", label: "Transcribing" },
      { id: "delivered", label: "Delivered" }, { id: "failed", label: "Failed → Copy" }, { id: "history", label: "History" },
    ],
    defaultState: "listening",
    sequence: [["listening", 4200], ["transcribing", 1100], ["delivered", 1300], ["idle", 0]],
    onState,
    onTheme() { mount(); readColours(); mbKey = ""; paintMenubar(); },
  });
  readColours();
  placeOptions();

  // Inspection hooks for screenshots: ?menu=1 opens the menu, ?copied=1 shows copy feedback, ?hoverRow=n,
  // ?hover=1 holds the overlay in its hover state (corners drawn), ?hoverChip=<id> holds one chip hovered.
  if (params.get("hover") === "1") root.classList.add("is-hover");
  if (params.get("hoverChip") && el.chips[params.get("hoverChip")]) el.chips[params.get("hoverChip")].classList.add("is-hover");
  if (params.get("menu") === "1") setTimeout(openMenu, 50);
  if (params.get("copied") === "1") { el.chips.copy.classList.add("is-copied"); el.copyBtn.classList.add("is-copied"); }
  if (params.get("hoverRow")) { const r = root.querySelector(`.sg-hrow[data-i="${+params.get("hoverRow") - 1}"]`); if (r) r.classList.add("is-hover"); }
})();
</script>
</body>
</html>
